<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>英语认读系统｜来自太空的小头脑</title>
    <!-- 纯离线：原先从 cdnjs 加载的 Font Awesome 已移除，图标改为内联 SVG -->
    <style>
        /* ===== 内联 SVG 图标（替代 Font Awesome 外链） ===== */
        .ico { width: 1em; height: 1em; vertical-align: -0.14em; flex-shrink: 0; }
        .ico-dot { width: 0.5em; height: 0.5em; vertical-align: 0.1em; }

        /* ===== 高级渲染：卡片入场动效 ===== */
        /* 动画挂在 .letter-card.anim 上，每次换内容由 JS 重放，
           这样普通模式与高级渲染才是两套不同的动效。 */
        .letter-card.anim .letter-display { animation: simpleFade 0.25s ease; }
        @keyframes simpleFade {
            0% { opacity: 0; transform: scale(0.97); }
            100% { opacity: 1; transform: scale(1); }
        }
        body.advanced .letter-card.anim .letter-display {
            animation: glassIn 0.52s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes glassIn {
            0% { opacity: 0; transform: translateY(34px) scale(0.9); filter: blur(6px); }
            55% { opacity: 1; }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }
        body.advanced .letter-card.anim .letter-info {
            animation: softRise 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.06s both;
        }
        body.advanced .letter-card.anim .word-meaning,
        body.advanced .letter-card.anim .sentence-translation {
            animation: softRise 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.12s both;
        }
        body.advanced .letter-card.anim .voice-btn {
            animation: softRise 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.18s both;
        }
        @keyframes softRise {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* 高级渲染：每次换内容扫过玻璃高光 */
        .glass-sweep { display: none; }
        body.advanced .glass-sweep {
            display: block;
            position: absolute;
            inset: -20%;
            background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, 0.4) 48%, transparent 61%);
            transform: translateX(-120%);
            pointer-events: none;
            z-index: 2;
        }
        body.advanced .glass-sweep.run {
            animation: glassSweep 0.62s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes glassSweep {
            from { transform: translateX(-120%); }
            to { transform: translateX(120%); }
        }

        /* 高级渲染：统计数字变化时弹一下 */
        body.advanced .stat-value.bump {
            animation: statBump 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes statBump {
            0% { transform: scale(1); }
            40% { transform: scale(1.22); }
            100% { transform: scale(1); }
        }

        /* 答对/答错时卡片边框闪一下 */
        .letter-card.flash-correct { animation: flashCorrect 0.6s ease !important; }
        .letter-card.flash-wrong { animation: flashWrong 0.5s ease !important; }
        @keyframes flashCorrect {
            0%, 100% { box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); }
            30% { box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.45); }
        }
        @keyframes flashWrong {
            0%, 100% { box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); }
            30% { box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.4); }
        }

        /* ===== 离线自评（识别不可用时兜底） ===== */
        .self-check {
            display: none;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 6px;
            padding: 6px 12px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.35);
            border: 1px dashed rgba(148, 163, 184, 0.5);
            font-size: 0.75rem;
            color: #475569;
        }
        .self-check.show { display: flex; }
        body.advanced .self-check { background: rgba(255, 255, 255, 0.18); border-color: rgba(255, 255, 255, 0.3); color: #334155; }
        body.night .self-check { background: rgba(0, 0, 0, 0.3); border-color: rgba(255, 255, 255, 0.12); color: #b0c0d0; }
        .self-check-btn {
            border: none;
            border-radius: 40px;
            padding: 4px 14px;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }
        .self-check-btn.ok { background: rgba(34, 197, 94, 0.15); color: #15803d; }
        .self-check-btn.ok:hover { background: rgba(34, 197, 94, 0.3); transform: translateY(-1px); }
        .self-check-btn.no { background: rgba(244, 63, 94, 0.12); color: #be123c; }
        .self-check-btn.no:hover { background: rgba(244, 63, 94, 0.25); transform: translateY(-1px); }

        /* ===== 降级与无障碍 ===== */
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            body.advanced .glass-card,
            body.advanced .letter-card,
            body.advanced .controls-card,
            body.advanced .stats-card,
            body.advanced .history-section { background: rgba(255, 255, 255, 0.74); }
            body.advanced .glass-toggle { background: rgba(255, 255, 255, 0.6); }
            body.night.advanced .glass-card,
            body.night.advanced .letter-card,
            body.night.advanced .controls-card,
            body.night.advanced .stats-card,
            body.night.advanced .history-section { background: rgba(10, 14, 26, 0.78); }
            body.night.advanced .glass-toggle { background: rgba(255, 255, 255, 0.08); }
        }
        @media (prefers-reduced-motion: reduce) {
            body.advanced::before,
            body.advanced::after,
            body.advanced .letter-card::after,
            .listening-indicator { animation: none !important; }
            .glass-sweep { display: none !important; }
            .letter-card.anim .letter-display,
            body.advanced .letter-card.anim .letter-info,
            body.advanced .letter-card.anim .word-meaning,
            body.advanced .letter-card.anim .sentence-translation,
            body.advanced .letter-card.anim .voice-btn,
            body.advanced .stat-value.bump { animation: none !important; }
            .glass-card, .letter-card, .controls-card, .stats-card, .history-section,
            .glass-toggle, .voice-btn, .btn { transition-duration: 0.01ms !important; }
        }

        /* ===== 基础重置 & 默认渲染 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #e8edf5;
            min-height: 100vh;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, -apple-system, sans-serif;
            padding: 16px 20px;
            color: #1e293b;
            transition: background 0.6s ease, color 0.4s ease;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* ===== 高级渲染：灰色护眼背景 + 淡蓝/淡绿光晕 (iOS 26 风格) ===== */
        body.advanced {
            background: #d5dbe3;
            color: #0f172a;
        }
        body.advanced::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle at 20% 30%, rgba(180, 210, 240, 0.3), rgba(200, 230, 220, 0.15) 40%, #d5dbe3 85%);
            animation: breatheGlow 12s ease-in-out infinite alternate;
        }
        body.advanced::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle at 80% 70%, rgba(160, 200, 180, 0.2), transparent 60%);
            animation: breatheGlow2 15s ease-in-out infinite alternate;
        }
        @keyframes breatheGlow {
            0% { transform: scale(1) rotate(0deg); opacity: 0.6; }
            100% { transform: scale(1.15) rotate(2deg); opacity: 1; }
        }
        @keyframes breatheGlow2 {
            0% { transform: scale(0.92) rotate(-2deg); opacity: 0.4; }
            100% { transform: scale(1.08) rotate(2deg); opacity: 0.8; }
        }
        body.advanced .container { position: relative; z-index: 1; }

        /* ===== 夜间模式（独立或叠加） ===== */
        body.night {
            background: #0a0e1a;
            color: #e0e8f0;
        }
        body.night.advanced {
            background: #0a0e1a;
        }
        body.night.advanced::before {
            background: radial-gradient(circle at 20% 30%, rgba(80, 120, 220, 0.25), rgba(40, 60, 140, 0.15) 40%, #0a0e1a 85%);
        }
        body.night.advanced::after {
            background: radial-gradient(circle at 80% 70%, rgba(120, 80, 200, 0.15), transparent 60%);
        }
        body.night:not(.advanced) {
            background: #0d1117;
        }

        /* ===== 容器 ===== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ===== 卡片基础样式 ===== */
        .glass-card,
        .letter-card,
        .controls-card,
        .stats-card,
        .history-section {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(200, 210, 220, 0.3);
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            z-index: 1;
        }

        /* ===== iOS 26 液态玻璃渲染（高级模式） ===== */
        body.advanced .glass-card,
        body.advanced .letter-card,
        body.advanced .controls-card,
        body.advanced .stats-card,
        body.advanced .history-section {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(40px) saturate(1.8);
            -webkit-backdrop-filter: blur(40px) saturate(1.8);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            border-radius: 32px;
        }
        body.advanced .glass-card:hover,
        body.advanced .letter-card:hover,
        body.advanced .controls-card:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }
        body.advanced .glass-card::before,
        body.advanced .letter-card::before,
        body.advanced .controls-card::before,
        body.advanced .stats-card::before,
        body.advanced .history-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            opacity: 0.6;
            pointer-events: none;
        }
        body.advanced .letter-card::after {
            content: '';
            position: absolute;
            top: -30%;
            left: -30%;
            width: 160%;
            height: 160%;
            background: radial-gradient(circle at 40% 30%, rgba(200, 230, 240, 0.06), transparent 60%);
            pointer-events: none;
            animation: cardGlow 8s ease-in-out infinite alternate;
            z-index: 0;
        }
        body.advanced .letter-card>* { position: relative; z-index: 1; }
        @keyframes cardGlow {
            0% { transform: translate(-5%, -5%) scale(1); opacity: 0.3; }
            100% { transform: translate(5%, 5%) scale(1.12); opacity: 0.6; }
        }

        /* ===== 夜间模式卡片 ===== */
        body.night .glass-card,
        body.night .letter-card,
        body.night .controls-card,
        body.night .stats-card,
        body.night .history-section {
            background: rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            color: #e0e8f0;
        }
        body.night .glass-card:hover,
        body.night .letter-card:hover,
        body.night .controls-card:hover {
            background: rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.12);
        }
        body.night.advanced .glass-card,
        body.night.advanced .letter-card,
        body.night.advanced .controls-card,
        body.night.advanced .stats-card,
        body.night.advanced .history-section {
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(40px) saturate(1.8);
            -webkit-backdrop-filter: blur(40px) saturate(1.8);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        body.night.advanced .glass-card:hover,
        body.night.advanced .letter-card:hover,
        body.night.advanced .controls-card:hover {
            background: rgba(0, 0, 0, 0.25);
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        body.night.advanced .letter-card::after {
            background: radial-gradient(circle at 40% 30%, rgba(80, 120, 240, 0.05), transparent 60%);
        }

        /* ===== 顶部导航/操作栏 ===== */
        header {
            text-align: center;
            padding: 16px 24px 14px;
            position: relative;
            overflow: visible;
            flex-shrink: 0;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 6px;
        }
        .header-title-group {
            text-align: left;
            flex: 1;
        }
        .header-title-group h1 {
            font-weight: 800;
            font-size: 1.8rem;
            letter-spacing: -0.5px;
            color: #1e293b;
            transition: color 0.4s;
            line-height: 1.2;
        }
        body.advanced .header-title-group h1 {
            background: linear-gradient(135deg, #1e293b, #4a6a8b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }
        body.night .header-title-group h1 { color: #e0e8f0; }
        body.night.advanced .header-title-group h1 {
            background: linear-gradient(135deg, #c0d0ff, #a0b8ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .header-title-group .subtitle {
            color: #475569;
            font-weight: 500;
            opacity: 0.8;
            font-size: 0.85rem;
            transition: color 0.4s;
            margin-top: 0px;
        }
        body.advanced .header-title-group .subtitle { color: #334155; }
        body.night .header-title-group .subtitle { color: #8899b0; }
        body.night.advanced .header-title-group .subtitle { color: #a0b0c8; }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .glass-toggle {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 40px;
            padding: 6px 14px;
            color: #1e293b;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .glass-toggle:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.5);
        }
        .glass-toggle:active { transform: scale(0.94); }
        body.night .glass-toggle {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
            color: #b0c0d0;
        }
        body.night .glass-toggle:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.2);
            color: #e0e8f0;
        }
        body.night.advanced .glass-toggle {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.06);
            color: #b0c0d0;
        }
        body.night.advanced .glass-toggle:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.12);
            color: #e0e8f0;
        }
        .glass-toggle.icon-only {
            padding: 6px 10px;
            font-size: 1.1rem;
        }
        #cycleTypeBtn {
            min-width: 90px;
            justify-content: center;
        }

        /* ===== 主内容（核心拉伸布局） ===== */
        .main-content {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            align-items: stretch;
            min-height: 60vh;
        }
        .letter-display-section {
            flex: 2.5;
            min-width: 320px;
            display: flex;
            flex-direction: column;
        }
        .controls-section {
            flex: 1.2;
            min-width: 280px;
            display: flex;
            flex-direction: column;
        }

        /* ===== 字母卡片（展示区） ===== */
        .letter-card {
            padding: 24px 20px;
            text-align: center;
            cursor: pointer;
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.15s, box-shadow 0.4s, background 0.4s;
            overflow: hidden;
            min-height: 40vh;
        }
        .letter-card:active { transform: scale(0.98); }
        body.advanced .letter-card:active { transform: scale(0.96); }

        .letter-display {
            font-weight: 800;
            line-height: 1.1;
            margin: 4px 0;
            overflow: hidden;
            max-width: 100%;
            word-break: break-word;
            color: #1e293b;
            transition: color 0.4s;
        }
        body.advanced .letter-display { color: #0f172a; text-shadow: 0 2px 8px rgba(255, 255, 255, 0.3); }
        body.night .letter-display { color: #e0e8f0; }
        body.night.advanced .letter-display { color: #f0f4ff; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3); }

        .letter-display.letter {
            font-size: clamp(8rem, 18vw, 24rem);
            white-space: nowrap;
        }
        .letter-display.word {
            font-size: clamp(5rem, 10vw, 16rem);
            white-space: normal;
            word-break: break-word;
            line-height: 1.2;
            padding: 8px 4px;
        }
        .letter-display.sentence {
            font-size: clamp(2.2rem, 4.5vw, 6.5rem);
            white-space: normal;
            line-height: 1.4;
            padding: 8px 4px;
        }

        @keyframes slideUpFade { 0% { opacity: 0; transform: translateY(28px) scale(0.94); } 100% { opacity: 1; transform: translateY(0) scale(1); } }

        .letter-info {
            font-size: 0.9rem;
            background: rgba(240, 245, 250, 0.6);
            display: inline-block;
            padding: 4px 18px;
            border-radius: 40px;
            margin: 6px auto;
            border: 1px solid rgba(200, 210, 220, 0.2);
            color: #334155;
            transition: background 0.4s, border 0.4s, color 0.4s;
        }
        body.advanced .letter-info {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #1e293b;
            backdrop-filter: blur(4px);
        }
        body.night .letter-info {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.08);
            color: #b0c0d0;
        }
        body.night.advanced .letter-info {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.06);
            color: #c0d0e0;
        }

        .word-meaning, .sentence-translation {
            font-size: 1rem;
            background: rgba(248, 245, 235, 0.5);
            padding: 4px 16px;
            border-radius: 28px;
            display: inline-block;
            margin-top: 6px;
            border: 1px solid rgba(220, 210, 190, 0.2);
            transition: background 0.4s, border 0.4s, color 0.4s;
        }
        body.advanced .word-meaning, body.advanced .sentence-translation {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #1e293b;
            backdrop-filter: blur(4px);
        }
        body.night .word-meaning, body.night .sentence-translation {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.06);
            color: #b0c0d0;
        }
        body.night.advanced .word-meaning, body.night.advanced .sentence-translation {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.06);
            color: #c0d0e0;
        }

        /* ===== 发音按钮 ===== */
        .voice-btn {
            background: rgba(26, 188, 156, 0.1);
            border: 1px solid rgba(26, 188, 156, 0.2);
            color: #1abc9c;
            padding: 6px 22px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
        }
        .voice-btn:hover {
            background: rgba(26, 188, 156, 0.2);
            border-color: rgba(26, 188, 156, 0.3);
            transform: translateY(-2px);
        }
        .voice-btn:active { transform: scale(0.94); }
        body.advanced .voice-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #1e293b;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
        }
        body.advanced .voice-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.4);
            color: #0f172a;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.04);
        }
        body.night .voice-btn {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.06);
            color: #b0c0d0;
        }

        function playClickSound() {
            try {

                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 800;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.06);
            } catch (_) {}
        }

        // 更新与存档逻辑照常跑）。⚠️ 默认人教版时一个字节都不动 —— 零回归。

        // ===== 反馈 =====
        let feedbackTimer = null;
        function showFeedback(msg) {

        // ===== 统计 =====
        function updateStats() {
            const before = {
                draws: totalDrawsSpan.textContent,
                correct: correctSpan.textContent,
                acc: accuracySpan.textContent
            };
            totalDrawsSpan.textContent = stats.totalDraws;
            correctSpan.textContent = stats.correctPronunciations;
            let acc = stats.totalDraws ? Math.round((stats.correctPronunciations / stats.totalDraws) * 100) : 0;
            accuracySpan.textContent = acc + '%';
            if (currentContentType === 'word' && currentWordBank.length) {
                currentIndexSpan.textContent = (currentWordIndex + 1) + '/' + currentWordBank.length;
            } else if (currentContentType === 'sentence' && currentSentenceBank.length) {
                currentIndexSpan.textContent = (currentSentenceIndex + 1) + '/' + currentSentenceBank.length;
            } else {
                currentIndexSpan.textContent = '0/0';
            }
            bumpStat(totalDrawsSpan, before.draws);
            bumpStat(correctSpan, before.correct);
            bumpStat(accuracySpan, before.acc);
        }

        function bumpStat(el, prev) {
            if (el.textContent === prev) return;
            el.classList.remove('bump');
            void el.offsetWidth;
            el.classList.add('bump');
            setTimeout(() => el.classList.remove('bump'), 500);
        }

        function updateHistory() {
            historyListDiv.innerHTML = '';
            history.slice(0, 12).forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `${item.content} ${item.isBold ? '<span class="bold-mark">⭐</span>' : ''}`;
                div.onclick = () => {
                    if (item.type === 'word') {
                        currentContentData = { content: item.content, chinese: item.chinese, type: 'word',
                            isBold: item.isBold };
                        updateDisplay();
                    } else if (item.type === 'sentence') {
                        currentContentData = { content: item.content, chinese: item.chinese, type: 'sentence' };
                        updateDisplay();
                    } else {
                        currentContentData = { content: item.content, type: 'letter', isUppercase: true };
                        updateDisplay();
                    }
                    showFeedback(`重新练习: ${item.content}`);
                    playClickSound();
                };
                historyListDiv.appendChild(div);
            });
        }

        // ===== 显示更新 =====
        function updateDisplay() {
            const { content, type, chinese, isBold } = currentContentData;
            // 入场动效交给 CSS 的 .letter-card.anim（普通/高级两套不同），
            // 这里只负责重放，且不再硬编码某一种动画。
            replayCardAnimations();
            hideSelfCheck();

            currentContentEl.textContent = content || '';

            currentContentEl.className = 'letter-display';

                wordMeaningDiv.style.display = 'block';

                sentenceTranslationDiv.style.display = 'block';
                sentenceChineseSpan.textContent = chinese || '';
                let len = (content || '').length;
                let size = len <= 20 ? 'clamp(2.2rem, 4vw, 6rem)' : len <= 40 ? 'clamp(1.8rem, 3.5vw, 5rem)' :
                    'clamp(1.5rem, 3vw, 4rem)';

                currentContentEl.style.padding = '8px 4px';
            } else {
                currentContentEl.classList.add('letter');
                contentInfoEl.textContent = type === 'letter' ? (currentContentData.isUppercase ? `大写字母 ${content}` :
                    `小写字母 ${content}`) : '';
                wordMeaningDiv.style.display = 'none';
                sentenceTranslationDiv.style.display = 'none';
                currentContentEl.style.fontSize = '';
                currentContentEl.style.padding = '10px';
            }
            recognitionResult.textContent = '';
            recognitionResult.className = 'recognition-result';
            updateStats();
        }

        // ===== 数据加载 =====
        function loadCurrentContent() {
            const grade = gradeSelect.value;
            const book = bookSelect.value;
            const unit = unitSelect.value;
            if (!grade || !book || !unit) return;

            if (currentContentType === 'word') {
                // ★ 教材切换：读当前出版社的词库
                const words = activeBank()[grade]?.[book]?.[unit] || [];
                currentWordBank = words;
                currentWordIndex = 0;
                if (currentWordBank.length === 0) {
                    showFeedback('当前单元无单词，请切换单元');
                    currentContentData = { content: '无单词', type: 'word', chinese: '' };
                    updateDisplay();
                } else {
                    drawContent();
                }
            } else if (currentContentType === 'sentence') {
                const sentences = sentenceBank[grade]?.[book]?.[unit] || [];
                currentSentenceBank = sentences;
                currentSentenceIndex = 0;
                if (currentSentenceBank.length === 0) {
                    showFeedback('当前单元无句子，请切换单元');
                    currentContentData = { content: '无句子', type: 'sentence', chinese: '' };
                    updateDisplay();
                } else {
                    drawContent();
                }
            }
            updateStats();
        }

        // ===== 抽取内容 =====
        function drawContent() {
            if (currentContentType !== 'word' && currentContentType !== 'sentence') {
                const isUp = Math.random() > 0.5;
                const letters = isUp ? 'ABCDEFGHIJKLMNOPQRSTUVWXYZ' : 'abcdefghijklmnopqrstuvwxyz';
                const letter = letters[Math.floor(Math.random() * 26)];
                currentContentData = { content: letter, type: 'letter', isUppercase: isUp };
                updateDisplay();
                stats.totalDraws++;
                history.unshift({ content: letter, type: 'letter' });
                updateStats();
                updateHistory();
                return;
            }

            if (currentContentType === 'word') {
                if (currentWordBank.length === 0) { showFeedback('当前无单词，请选择其他单元'); return; }
                let idx;
                if (isStudyMode) {
                    idx = currentWordIndex % currentWordBank.length;
                    currentWordIndex = (idx + 1) % currentWordBank.length;
                } else {
                    idx = Math.floor(Math.random() * currentWordBank.length);
                    currentWordIndex = idx;
                }
                const word = currentWordBank[idx];
                currentContentData = { content: word.word, chinese: word.chinese, type: 'word', isBold: word.isBold };
                updateDisplay();
                stats.totalDraws++;
                history.unshift({ content: word.word, chinese: word.chinese, type: 'word', isBold: word.isBold });
                updateStats();
                updateHistory();
                if (isReadMode) startRecognition();
            } else if (currentContentType === 'sentence') {
                if (currentSentenceBank.length === 0) { showFeedback('当前无句子，请选择其他单元'); return; }
                let idx;
                if (isStudyMode) {
                    idx = currentSentenceIndex % currentSentenceBank.length;
                    currentSentenceIndex = (idx + 1) % currentSentenceBank.length;
                } else {
                    idx = Math.floor(Math.random() * currentSentenceBank.length);
                    currentSentenceIndex = idx;
                }
                const sentence = currentSentenceBank[idx];
                currentContentData = { content: sentence.sentence, chinese: sentence.chinese, type: 'sentence' };
                updateDisplay();
                stats.totalDraws++;
                history.unshift({ content: sentence.sentence, chinese: sentence.chinese, type: 'sentence' });
                updateStats();
                updateHistory();
                if (isReadMode) startRecognition();
            }
        }

        function nextContent() {
            drawContent();
        }

        function normalizeSpeech(s) {
            return String(s || '')
                .toLowerCase()
                .replace(/[\u2018\u2019\u02bc]/g, "'")
                .replace(/[\u2013\u2014\u2212]/g, ' ')
                .replace(/[^a-z0-9'\s]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function speechMatches(target, heard) {
            const t = normalizeSpeech(target);
            const h = normalizeSpeech(heard);
            if (!t || !h) return false;
            if (t === h) return true;
            if (t.replace(/['\s]/g, '') === h.replace(/['\s]/g, '')) return true;
            if (t.length > 3 && h.includes(t)) return true;
            if (h.length > 3 && t.includes(h)) return true;
            return false;
        }

        function markReading(correct, transcript) {
            if (correct) {
                stats.correctPronunciations = Math.min(stats.correctPronunciations + 1, stats.totalDraws);
                showFeedback('🎉 发音正确！');
                flashCard('correct');
            } else {
                showFeedback('💪 再练练吧，目标是: ' + (currentContentData.content || ''));
                flashCard('wrong');
            }
            updateStats();
            updateHistory();
        }

        function flashCard(kind) {
            if (!backgroundCard) return;
            backgroundCard.classList.remove('flash-correct', 'flash-wrong');
            void backgroundCard.offsetWidth;
            backgroundCard.classList.add(kind === 'correct' ? 'flash-correct' : 'flash-wrong');
            setTimeout(() => backgroundCard.classList.remove('flash-correct', 'flash-wrong'), 700);
        }

        // 识别拿不到结果时（断网/无权限/不支持）改为跟读自评，别把课堂卡死
        function showSelfCheck(reason) {
            if (!selfCheck) return;
            if (currentContentType === 'letter') {
                selfCheck.classList.remove('show');
                return;
            }
            selfCheck.classList.add('show');
            selfCheckReason.textContent = reason;
        }

        function hideSelfCheck() {
            if (selfCheck) selfCheck.classList.remove('show');
        }
        // ===== 发音：优先播放录音，缺录音时回退语音合成 =====
        // 录音命名（与听力练习场共用同一份 audio 文件夹）：
        //   单词 -> <单词>.mp3      字母 -> <大写字母>.mp3
        //   句子 -> <安全化文本>__<FNV-1a 哈希>.mp3
        // 句子里有 ? : " 这类字符，Windows 文件名不允许，而浏览器会把 URL 里的
        // %3F 之类解码回原字符，所以只能安全化后再挂内容哈希，两边算法必须一致。
        function fnv1a8(text) {
            let h = 0x811C9DC5;
            const bytes = new TextEncoder().encode(text);
            for (let i = 0; i < bytes.length; i++) {
                h ^= bytes[i];
                h = Math.imul(h, 0x01000193) >>> 0;
            }
            return h.toString(16).padStart(8, '0');
        }

        function audioFileName(text, type) {
            const s = String(text || '');
            if (type === 'letter') return s.toUpperCase() + '.mp3';
            if (type === 'sentence') {
                let slug = '';
                for (const ch of s) {
                    slug += /[A-Za-z0-9]/.test(ch) ? ch : '_';
                    if (slug.length >= 40) break;
                }
                return slug + '__' + fnv1a8(s) + '.mp3';
            }
            return s + '.mp3';
        }

        let audioEl = null;
        let ttsNoticeShown = false;

        function speakWithTTS(text) {
            const say = window.speechSynthesis && window.speechSynthesis.speak;
            if (!say) {
                if (window.__showToast) window.__showToast('⚠️ 这条没有录音，浏览器也不支持语音合成');
                return;
            }
            if (!ttsNoticeShown) {
                ttsNoticeShown = true;
                if (window.__showToast) {
                    window.__showToast('ℹ️ 少数句子没有录音文件，已改用系统语音朗读（不影响单词和字母）', 4200);
                }
            }
            const utterance = new SpeechSynthesisUtterance(String(text));
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }

        function playContentAudio() {
            const data = currentContentData;
            if (!data || !data.content) return;
            const url = './audio/' + encodeURIComponent(audioFileName(data.content, data.type));
            try {
                if (!audioEl) audioEl = new Audio();
                audioEl.pause();
                audioEl.currentTime = 0;
                audioEl.src = url;
                const p = audioEl.play();
                if (p && p.catch) p.catch(() => speakWithTTS(data.content));
            } catch (_) {
                speakWithTTS(data.content);
            }
        }

        function speakContent() {
            playContentAudio();
        }

        // ===== 语音识别 =====
        // ===== 语音识别 =====
        function initRecognition() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                showFeedback('⚠️ 浏览器不支持语音识别，已切换为跟读自评');
                showSelfCheck('本浏览器不支持自动判分');
                return null;
            }
            const rec = new SR();
            rec.lang = 'en-US';
            rec.continuous = false;
            rec.interimResults = false;
            rec.maxAlternatives = 1;

            rec.onstart = function() {
                isRecognizing = true;
                listeningIndicator.classList.add('active');
                recognitionResult.textContent = '👂 聆听中...';
                recognitionResult.className = 'recognition-result';
            };

            rec.onerror = function(event) {
                isRecognizing = false;
                listeningIndicator.classList.remove('active');
                if (event.error === 'not-allowed') {
                    recognitionResult.textContent = '❌ 麦克风权限被拒绝';
                    recognitionResult.className = 'recognition-result wrong';
                    showFeedback('请允许使用麦克风');
                    showSelfCheck('麦克风权限被拒绝，可自己评一下');
                } else if (event.error === 'no-speech') {
                    recognitionResult.textContent = '🔇 未检测到语音，请重试';
                    recognitionResult.className = 'recognition-result wrong';
                } else if (event.error === 'network' || event.error === 'service-not-allowed') {
                    recognitionResult.textContent = '📴 无法联网识别，已切换为跟读自评';
                    recognitionResult.className = 'recognition-result wrong';
                    showFeedback('离线状态：自己判断读得对不对吧');
                    showSelfCheck('当前离线，无法自动判分');
                } else {
                    recognitionResult.textContent = '⚠️ 识别错误: ' + event.error;
                    recognitionResult.className = 'recognition-result wrong';
                }
                if (recognitionTimeout) { clearTimeout(recognitionTimeout);
                    recognitionTimeout = null; }
            };

            rec.onend = function() {
                isRecognizing = false;
                listeningIndicator.classList.remove('active');
                if (recognitionTimeout) { clearTimeout(recognitionTimeout);
                    recognitionTimeout = null; }
                if (!recognitionResult.textContent || recognitionResult.textContent === '👂 聆听中...') {
                    recognitionResult.textContent = '⏱️ 未识别到内容，请点击卡片重试';
                    recognitionResult.className = 'recognition-result wrong';
                }
            };

            rec.onresult = function(event) {
                const result = event.results[0];
                if (!result) return;
                const transcript = result[0].transcript.trim();
                isRecognizing = false;
                listeningIndicator.classList.remove('active');
                if (recognitionTimeout) { clearTimeout(recognitionTimeout);
                    recognitionTimeout = null; }

                hideSelfCheck();
                const target = currentContentData.content || '';

                if (speechMatches(target, transcript)) {
                    recognitionResult.textContent = '✅ 正确！ 👏 你说: "' + transcript + '"';
                    recognitionResult.className = 'recognition-result correct';
                    markReading(true, transcript);
                } else {
                    recognitionResult.textContent = '❌ 再试一次  你说: "' + transcript + '"  目标: "' + target + '"';
                    recognitionResult.className = 'recognition-result wrong';
                    markReading(false, transcript);
                }
            };
            return rec;
        }

        function startRecognition() {
            if (!isReadMode || currentContentType === 'letter') return;
            if (recognition) { try { recognition.abort(); } catch (_) {} }
            if (!recognition) { recognition = initRecognition(); if (!recognition) return; }
            hideSelfCheck();
            if (recognitionTimeout) { clearTimeout(recognitionTimeout);
                recognitionTimeout = null; }
            try {
                recognition.start();
                recognitionTimeout = setTimeout(() => {
                    if (isRecognizing) {
                        try { recognition.abort(); } catch (_) {}
                        isRecognizing = false;
                        listeningIndicator.classList.remove('active');
                        recognitionResult.textContent = '⏱️ 识别超时，请点击卡片重试';
                        recognitionResult.className = 'recognition-result wrong';
                    }
                    recognitionTimeout = null;
                }, 6000);
            } catch (_) {}
        }

        backgroundCard.addEventListener('click', function(e) {
            if (e.target.closest('button') || e.target.closest('.toggle-switch')) return;
            if (isReadMode && currentContentType !== 'letter') {
                startRecognition();
            } else {
                nextContent();
            }
        });

        // ===== 认读模式切换 =====
        readModeToggle.addEventListener('change', function(e) {
            isReadMode = this.checked;
            if (isReadMode) {
                if (!recognition) recognition = initRecognition();
                if (!recognition) showSelfCheck('当前无法自动判分，读完后自己评一下');
                else hideSelfCheck();
                showFeedback('🎤 认读模式已开启，点击卡片开始语音练习');
                if (currentContentType !== 'letter' && currentContentData.content) {
                    setTimeout(() => startRecognition(), 300);
                }
            } else {
                if (recognition) { try { recognition.abort(); } catch (_) {} }
                isRecognizing = false;
                listeningIndicator.classList.remove('active');
                if (recognitionTimeout) { clearTimeout(recognitionTimeout);
                    recognitionTimeout = null; }
                recognitionResult.textContent = '';
                recognitionResult.className = 'recognition-result';
                hideSelfCheck();
                showFeedback('🔇 认读模式已关闭');
            }
        });

        // ===== 内容类型循环切换 =====
        const typeLabels = ['🔤 字母', '📖 单词', '💬 句子'];
        const typeMap = ['letter', 'word', 'sentence'];
        let typeIndex = 1;

        function cycleContentType() {
            typeIndex = (typeIndex + 1) % 3;
            const newType = typeMap[typeIndex];
            switchContentType(newType);
            cycleTypeBtn.innerHTML = typeLabels[typeIndex];
            showFeedback(`切换到 ${typeLabels[typeIndex]}`);
        }

        cycleTypeBtn.addEventListener('click', cycleContentType);

        function switchContentType(type) {
            currentContentType = type;
            if (type === 'letter') {
                contentSelector.style.display = 'none';
                currentContentData = { content: 'A', type: 'letter', isUppercase: true };
                updateDisplay();
                if (isReadMode && recognition) { try { recognition.abort(); } catch (_) {} }
            } else if (type === 'word') {
                contentSelector.style.display = 'block';
                updateUnitOptions();
            } else {
                contentSelector.style.display = 'block';
                updateUnitOptions();
            }
            stats.totalDraws = 0;
            stats.correctPronunciations = 0;
            updateStats();
            recognitionResult.textContent = '';
            recognitionResult.className = 'recognition-result';
            hideSelfCheck();
        }

        // ===== 控件 =====
        function updateUnitOptions() {
            const grade = gradeSelect.value;
            const book = bookSelect.value;
            if (!grade || !book) {
                unitSelect.innerHTML = '<option disabled selected>请先选择年级和册别</option>';
                unitSelect.disabled = true;
                return;
            }
            let units = [];
            if (currentContentType === 'word') {
                // ★ 教材切换：读当前出版社的词库
                const bank = activeBank();
                units = bank[grade]?.[book] ? Object.keys(bank[grade][book]) : [];
            } else if (currentContentType === 'sentence') {
                units = sentenceBank[grade]?.[book] ? Object.keys(sentenceBank[grade][book]) : [];
            }
            if (units.length === 0) {
                unitSelect.innerHTML = '<option disabled>无单元数据</option>';
                unitSelect.disabled = true;
            } else {
                unitSelect.innerHTML = units.map(u => `<option value="${u}">${u}</option>`).join('');
                unitSelect.disabled = false;
                loadCurrentContent();
            }
        }

        gradeSelect.addEventListener('change', updateUnitOptions);
        bookSelect.addEventListener('change', updateUnitOptions);
        unitSelect.addEventListener('change', loadCurrentContent);
        document.querySelector('.grade-book-selector') &&
            document.querySelector('.grade-book-selector').addEventListener('change', saveSetup);

        // ===== 顺序/抽读模式 =====
        studyModeBtn.addEventListener('click', function() {
            isStudyMode = !isStudyMode;
            currentStudyModeSpan.textContent = isStudyMode ? '顺序模式' : '抽读模式';
            this.innerHTML = isStudyMode ?
                '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="m4 4 5 5"/></svg> 切换抽读模式' : '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16"/><path d="m3 8 4-4 4 4"/><path d="M17 20V4"/><path d="m21 16-4 4-4-4"/></svg> 切换顺序模式';
            if (currentContentType === 'word') { currentWordIndex = 0;
                loadCurrentContent(); } else if (currentContentType === 'sentence') { currentSentenceIndex = 0;
                loadCurrentContent(); }
            showFeedback(isStudyMode ? '已切换为顺序模式' : '已切换为抽读模式');
        });

        speakBtn.addEventListener('click', speakContent);

        // ===== 跟读自评（识别不可用时的兜底） =====
        selfCheckOk.addEventListener('click', function() {
            markReading(true, '(自评)');
            hideSelfCheck();
        });
        selfCheckNo.addEventListener('click', function() {
            markReading(false, '(自评)');
            speakContent();
        });

        // ===== 键盘快捷键 =====
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') { e.preventDefault();
                nextContent(); } else if (e.code === 'KeyS') { e.preventDefault();
                speakContent(); } else if (e.code === 'KeyR') { e.preventDefault();
                readModeToggle.checked = !readModeToggle.checked;
                readModeToggle.dispatchEvent(new Event('change')); } else if (e.code === 'KeyM') { e.preventDefault();
                studyModeBtn.click(); } else if (e.code === 'Digit1') { e.preventDefault();
                cycleContentType(); }
        });

        window.__showToast = function(msg, ms) {
            const el = document.getElementById('__toast');
            if (!el) return;
            el.textContent = msg;
            el.classList.add('on');
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(function() { el.classList.remove('on'); }, ms || 3000);
        };

        // ===== 初始化 =====
        const saved = loadSetup();
        if (saved) {
            if (saved.advanced) {
                advancedToggleHeader.classList.add('active');
                advancedToggleHeader.style.color = '#4f83f5';
            }
            if (saved.night) {
                nightToggleHeader.classList.add('active');
                nightToggleHeader.style.color = '#a0b8ff';
            }
            if (saved.grade) gradeSelect.value = saved.grade;
            if (saved.book) bookSelect.value = saved.book;
        }
        updateModes();
        switchContentType('word');
        if (saved && saved.unit) {
            const opt = Array.from(unitSelect.options).find(o => o.value === saved.unit);
            if (opt) unitSelect.value = saved.unit;
        }
        updateUnitOptions();

        console.log('✅ 英语认读系统已启动 | 录播发音 + 离线自评');
        console.log('🎯 快捷键: 空格抽取 | S发音 | R认读 | M顺序/随机 | 1 切换板块');
    </script>
<style>
/* ============================================================
   单元选择：二级卡片（替掉原生下拉）
   原生 <select> 的弹层是系统白底，和主题给的浅色文字糊在一起看不清，
   所以整行藏掉，换成一个按钮 + 自绘卡片。原生 select 仍在 DOM 里承载逻辑。
   配色见下方按主题写的显式色值。
   ============================================================ */
.pk-hide{display:none !important}
.pk-btn{
  display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 15px;
  border-radius:40px;font-family:inherit;font-size:.9rem;font-weight:700;
  cursor:pointer;transition:transform .16s,filter .16s,background .16s;
  max-width:min(70vw,320px);
}
.pk-btn:hover{transform:translateY(-1px);filter:brightness(1.03)}
.pk-btn:active{transform:scale(.97)}
.pk-btn .pk-cur{opacity:.55;font-size:.76rem;font-weight:600}
.pk-mask{
  position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
  padding:18px;background:rgba(32,18,52,.5);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
}
.pk-mask.show{display:flex;animation:pkFade .22s ease both}
.pk-mask.closing{animation:pkFadeOut .16s ease both}
@keyframes pkFade{from{opacity:0}to{opacity:1}}
@keyframes pkFadeOut{from{opacity:1}to{opacity:0}}
.pk-card{
  width:min(540px,100%);max-height:84vh;overflow-y:auto;
  border-radius:22px;padding:20px;
  /* 浅色底与字色放这里当默认；深色由 .pk-mask.dark 覆盖（见各工具的 palette） */
  background:rgba(255,255,255,.96);color:#1f2937;border:1px solid rgba(120,110,190,.22);
  box-shadow:0 24px 64px rgba(20,10,40,.45);
  animation:pkUp .28s cubic-bezier(.22,1,.36,1) both;
}
@keyframes pkUp{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.pk-h{margin:0 0 4px;font-size:1.1rem;font-weight:800}
.pk-sub{margin:0 0 4px;font-size:.76rem;color:#64748b}
.pk-sec{font-size:.75rem;font-weight:800;opacity:.65;margin:14px 0 8px;letter-spacing:.5px}
.pk-chips{display:flex;flex-wrap:wrap;gap:8px}
.pk-chip{
  min-height:44px;padding:0 16px;border-radius:40px;cursor:pointer;font-family:inherit;
  font-size:.87rem;font-weight:700;color:inherit;
  background:rgba(124,74,158,.09);border:1.5px solid rgba(124,74,158,.22);
  display:inline-flex;align-items:center;transition:background .16s,transform .16s;
}
.pk-chip:hover{background:rgba(124,74,158,.18)}
.pk-chip:active{transform:scale(.97)}
.pk-chip.on{background:linear-gradient(135deg,#7c4a9e,#a06bc8);border-color:transparent;color:#fff}
/* 多选层的工具栏 + "至少选一个"提示 */
.pk-tools{display:flex;gap:8px;margin-bottom:9px}
.pk-mini{
  min-height:36px;padding:0 13px;border-radius:30px;cursor:pointer;font-family:inherit;
  font-size:.78rem;font-weight:700;background:rgba(124,74,158,.09);
  border:1.5px solid rgba(124,74,158,.22);color:#5b3b8c;
}
.pk-mini:hover{filter:brightness(1.06)}
.pk-warn{font-size:.78rem;font-weight:700;color:#c0392b;margin-top:8px}
.pk-mask.dark .pk-warn{color:#ff9f93}
.pk-act .pk-ok[disabled]{opacity:.42;cursor:not-allowed}
.pk-act{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.pk-act button{
  min-height:46px;padding:0 22px;border-radius:40px;cursor:pointer;font-family:inherit;
  font-size:.9rem;font-weight:800;color:inherit;
  background:rgba(124,74,158,.10);border:1.5px solid rgba(124,74,158,.24);
}
.pk-act button:hover{background:rgba(124,74,158,.18)}
.pk-act .pk-ok{background:linear-gradient(135deg,#7c4a9e,#a06bc8);border-color:transparent;color:#fff}
@media (max-width:640px){
  .pk-card{padding:16px;border-radius:18px;max-height:88vh}
  .pk-chip{font-size:.83rem;padding:0 13px}
}
@media (prefers-reduced-motion: reduce){
  .pk-mask.show,.pk-mask.closing,.pk-card{animation:none !important}
}


/* 卡片挂在 body 下，用脚本打的 .dark 类，不靠工具的主题选择器 */
.pk-btn{background:rgba(255,255,255,.8);border:2px solid rgba(120,110,190,.28);color:#1e293b}
.pk-btn.dark{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.16);color:#e0e8f0}
.pk-mask.dark .pk-card{background:rgba(16,20,32,.96);color:#e0e8f0;border-color:rgba(255,255,255,.10)}
.pk-mask.dark .pk-sub{color:#a8b8c8}
.pk-mask.dark .pk-chip{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14)}
.pk-mask.dark .pk-chip:hover{background:rgba(255,255,255,.16)}
.pk-mask.dark .pk-act button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16)}
.pk-mask.dark .pk-card{backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6)}

</style>
<script>
/* ====== 单元选择：二级卡片（自动注入）====== */
(function () {
  // ★ 教材是最外一层。⚠️ 年级/册也改成 src:"data"：
  //   它们的可选项要跟着**卡片里当前选的教材**算；
  //   写成 "select" 的话 optionsOf() 会早退去读隐藏下拉的 option ——
  //   那是上家的年级（实测踩过：单元变了、册别没变）。
  var LVS = [{"sel": "publisherSelect", "sec": "教材", "src": "select"},
             {"sel": "gradeSelect", "sec": "年级", "src": "data"},
             {"sel": "bookSelect", "sec": "册别", "src": "data"},
             {"sel": "unitSelect", "sec": "单元", "src": "data"}];
  var ROW = '.selector-row';
  var LABEL = '选择单元';

    // ★ 卡片当前选的出版社 → 对应词库。**故意不读真实下拉**：
    //   卡片里点来点去不该提前改动工具状态，「取消」必须是真的取消。
    //   ⚠️ pick 是 boot() 里的局部变量，所以这里必须**当参数收进来**（不能直接引用）。
    function bankOfP(p) {
      if (p === 'jieli' && typeof JIELI_BANK !== 'undefined') return JIELI_BANK;
      return (typeof wordBank !== 'undefined') ? wordBank : {};
    }
    function gradesOfPick(v) { return Object.keys(bankOfP(v && v.publisherSelect)); }
    function booksOfPick(v) {
      var bk = bankOfP(v && v.publisherSelect);
      var g = bk[v.gradeSelect];
      return g ? Object.keys(g) : [];
    }
    function unitList(v) {
      var bk = bankOfP(v && v.publisherSelect);
      var g = bk[v.gradeSelect]; if (!g) return [];
      var b = g[v.bookSelect]; if (!b) return [];
      return Object.keys(b).map(function (u) { return { v: u, t: u }; });
    }

  // 哪一层是多选（没有就是 -1）
  var MULTI_IDX = -1;
  for (var _mi = 0; _mi < LVS.length; _mi++) { if (LVS[_mi].multi) { MULTI_IDX = _mi; break; } }

  function boot() {
    var els = [], rows = [];
    for (var i = 0; i < LVS.length; i++) {
      var e = document.getElementById(LVS[i].sel);
      if (!e) return;                     // 结构对不上就整体不启用，绝不半途插手
      els.push(e);
      var r = e.closest(ROW);
      if (r) { r.classList.add('pk-hide'); rows.push(r); }
    }
    var host = rows.length ? rows[0].parentNode : els[0].parentNode;

    // ---- 状态 ----
    var pick = {};
    function snapshot() {
      for (var i = 0; i < LVS.length; i++) {
        var L = LVS[i];
        if (L.multi) {
          var cur = (typeof multiGet === 'function') ? (multiGet() || []) : [];
          if (!cur.length && els[i].value) cur = [els[i].value];
          pick[L.sel] = cur.slice();
        } else {
          pick[L.sel] = els[i].value;
        }
      }
    }

    // ---- 取某一层的可选项 ----
    function optionsOf(i) {
      var L = LVS[i];
      if (L.src === 'select') {
        return Array.prototype.map.call(els[i].options, function (o) {
          return { v: o.value, t: (o.textContent || o.value).trim() };
        });
      }
      // ★ 年级/册跟着**卡片里当前选的教材**算（不读隐藏下拉的 option）
      if (L.sel === 'gradeSelect') {
        return gradesOfPick(pick).map(function (g) { return { v: g, t: gradeLabel(g) }; });
      }
      if (L.sel === 'bookSelect') {
        return booksOfPick(pick).map(function (b) { return { v: b, t: bookLabel(b) }; });
      }
      try { return unitList(pick) || []; } catch (err) { return []; }
    }

    // ---- 按钮上的当前选择 ----
    // live=true 表示读工具的真实状态，而不是卡片里的临时选择
    function curLabel(live) {
      var parts = [];
      for (var i = 0; i < LVS.length; i++) {
        var L = LVS[i];
        if (L.multi) {
          var arr = live ? ((typeof multiGet === 'function') ? (multiGet() || []) : [])
                         : (pick[L.sel] || []);
          if (!arr.length && els[i].value) arr = [els[i].value];   // 工具里还没记就按它当前值兜一个
          parts.push(arr.length ? arr.map(function (v) { return String(v).toUpperCase(); }).join('、') : '未选');
          continue;
        }
        var val = live ? els[i].value : pick[L.sel];
        var opts = optionsOf(i), hit = null;
        for (var j = 0; j < opts.length; j++) if (opts[j].v === val) { hit = opts[j]; break; }
        parts.push(hit ? hit.t : val);
      }
      return parts.join(' · ');
    }

    // ---- 建 UI ----
    var wrap = document.createElement('div');
    wrap.className = 'pk-btn-wrap';
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pk-btn';
    btn.id = 'pickUnitBtn';
    var lab = document.createElement('span');
    lab.id = 'pickUnitLabel';
    var arrow = document.createElement('span');
    arrow.className = 'pk-cur';
    arrow.textContent = '▾';
    var ico = document.createElement('span');
    ico.textContent = '📚';
    btn.appendChild(ico); btn.appendChild(lab); btn.appendChild(arrow);
    wrap.appendChild(btn);
    host.insertBefore(wrap, rows.length ? rows[0] : els[0]);

    var mask = document.createElement('div');
    mask.className = 'pk-mask';
    mask.id = 'unitPicker';
    mask.innerHTML =
      '<div class="pk-card" role="dialog" aria-modal="true" aria-label="' + LABEL + '">' +
        '<h3 class="pk-h">📚 ' + LABEL + '</h3>' +
        '<p class="pk-sub">选好后点「确定」，马上切过去。</p>' +
        '<div id="pkBody"></div>' +
        '<div class="pk-act">' +
          '<button type="button" id="pkCancel">取消</button>' +
          '<button type="button" class="pk-ok" id="pkOk">确定</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(mask);
    var body = mask.querySelector('#pkBody');

    function chip(text, on, fn) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'pk-chip' + (on ? ' on' : '');
      b.textContent = text;
      b.addEventListener('click', fn);
      return b;
    }
    function draw() {
      body.innerHTML = '';
      for (var i = 0; i < LVS.length; i++) {
        (function (idx) {
          var L = LVS[idx];
          var sec = document.createElement('div');
          sec.className = 'pk-sec';
          sec.textContent = L.sec + (L.multi ? '（' + '可多选' + '）' : '');
          body.appendChild(sec);
          var opts = optionsOf(idx);
          var isMulti = !!L.multi;
          if (isMulti && opts.length) {
            var tools = document.createElement('div');
            tools.className = 'pk-tools';
            var btnAll = document.createElement('button');
            btnAll.type = 'button'; btnAll.className = 'pk-mini'; btnAll.textContent = '本册全选';
            btnAll.addEventListener('click', function () {
              pick[L.sel] = opts.map(function (o) { return o.v; }); draw();
            });
            var btnNone = document.createElement('button');
            btnNone.type = 'button'; btnNone.className = 'pk-mini'; btnNone.textContent = '清空';
            btnNone.addEventListener('click', function () { pick[L.sel] = []; draw(); });
            tools.appendChild(btnAll); tools.appendChild(btnNone);
            body.appendChild(tools);
          }
          var box = document.createElement('div');
          box.className = 'pk-chips';
          if (!opts.length) {
            var em = document.createElement('div');
            em.className = 'pk-sub';
            em.textContent = '这一级还没有数据';
            box.appendChild(em);
          }
          opts.forEach(function (o) {
            var on = isMulti ? (pick[L.sel] || []).indexOf(o.v) >= 0 : pick[L.sel] === o.v;
            box.appendChild(chip(o.t, on, function () {
              if (isMulti) {
                var arr = (pick[L.sel] || []).slice();
                var k0 = arr.indexOf(o.v);
                if (k0 >= 0) arr.splice(k0, 1); else arr.push(o.v);
                pick[L.sel] = arr;
              } else {
                pick[L.sel] = o.v;
                for (var k = idx + 1; k < LVS.length; k++) {
                  var Lk = LVS[k];
                  if (Lk.multi) {                        // 换了册就给个合理默认：新册的第一个单元
                    var ok2 = optionsOf(k);
                    pick[Lk.sel] = ok2.length ? [ok2[0].v] : [];
                  } else {
                    pick[Lk.sel] = null;
                  }
                }
              }
              draw();
            }));
          });
          body.appendChild(box);
          if (isMulti && !(pick[L.sel] || []).length) {
            var w = document.createElement('div');
            w.className = 'pk-warn';
            w.textContent = '至少选一个单元';
            body.appendChild(w);
          }
        })(i);
      }
      // 多选层一个都没选 → 不让确定
      var ok = mask.querySelector('#pkOk');
      var bad = MULTI_IDX >= 0 && !(pick[LVS[MULTI_IDX].sel] || []).length;
      ok.disabled = bad;
      ok.style.opacity = bad ? '.45' : '';
      ok.style.cursor = bad ? 'not-allowed' : '';
    }
    function onKey(e) { if (e.key === 'Escape') close(); }
    function open() {
      snapshot(); paintTheme(); draw();
      mask.classList.remove('closing');
      mask.classList.add('show');
      document.addEventListener('keydown', onKey);
      setTimeout(function () { var b = mask.querySelector('#pkOk'); if (b) b.focus(); }, 40);
    }
    function close() {
      document.removeEventListener('keydown', onKey);
      if (!mask.classList.contains('show')) return;
      mask.classList.add('closing');
      setTimeout(function () {
        mask.classList.remove('show'); mask.classList.remove('closing');
        syncLabel();
      }, 160);
    }
    function apply() {
      // ★★ 先把「教材」落到真实下拉上：这一步会重建年级/册/单元并写存档。
      //    不先做它，下面拿到的年级名会在**旧出版社**的词库里找不到。
      if (pick['publisherSelect'] != null && els[0].value !== pick['publisherSelect']) {
        els[0].value = pick['publisherSelect'];
        els[0].dispatchEvent(new Event('change', { bubbles: true }));
      }
      // 多选：交给工具自己的钩子（只有它知道怎么把"多个单元"写回内部状态）
      if (MULTI_IDX >= 0 && typeof multiSet === 'function') {
        var g = pick['gradeSelect'];   // ★ 第 0 层现在是「教材」，不能再按 LVS[0] 取
        var us = pick[LVS[MULTI_IDX].sel] || [];
        if (g != null && us.length) { multiSet(g, us); syncLabel(); close(); return; }
      }
      // 单选：按层级顺序赋值 + 派发 change：工具自己的更新与存档逻辑原封不动跑一遍
      for (var i = 0; i < LVS.length; i++) {
        var L = LVS[i];
        if (pick[L.sel] == null) continue;
        if (els[i].value !== pick[L.sel]) {
          els[i].value = pick[L.sel];
          els[i].dispatchEvent(new Event('change', { bubbles: true }));
        }
      }
      close();
    }
    function syncLabel() {
      var t = curLabel(true);
      lab.textContent = t;
      btn.title = LABEL + '：' + t;
    }

    // ---- 深色模式 ----
    // 遮罩挂在 body 下，而消消乐的深色是加在 #app 上的 data-theme，
    // 认读系统是加在 body 的 .night —— 用选择器去猜嵌套关系很脆，
    // 所以由脚本自己判断、给按钮和卡片打类。
    function isDark() { try { return !!(document.body.classList.contains('night')); } catch (e) { return false; } }
    function paintTheme() {
      var d = isDark();
      mask.classList.toggle('dark', d);
      btn.classList.toggle('dark', d);
    }
    try {
      var tgt = (document.body);
      if (tgt && window.MutationObserver) {
        new MutationObserver(paintTheme).observe(tgt, { attributes: true, attributeFilter: ["class"] });
      }
    } catch (e) {}

    btn.addEventListener('click', open);
    mask.querySelector('#pkOk').addEventListener('click', apply);
    mask.querySelector('#pkCancel').addEventListener('click', close);
    mask.addEventListener('click', function (e) { if (e.target === mask) close(); });
    for (var i = 0; i < els.length; i++) els[i].addEventListener('change', syncLabel);
    paintTheme();
    syncLabel();
  }

  // ★ 起手：等工具自己的初始化跑完（含从 localStorage 恢复的那一步）再接管。
  //   存档是接力版才重建；默认人教版一个字都不动，零回归。
  document.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      var pSel = document.getElementById('publisherSelect');
      if (!pSel) return;
      pSel.value = publisher;
      if (publisher !== 'pep') applyPublisher(publisher);
      pSel.addEventListener('change', function () { applyPublisher(pSel.value); });
    }, 0);
  });

  if (document.readyState === 'loading') {
    // 排在工具自己的 DOMContentLoaded 之后跑，确保它已经初始化完
    document.addEventListener('DOMContentLoaded', function () { setTimeout(boot, 0); });
  } else {
    setTimeout(boot, 0);
  }
})();

</script>
