<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>英语认读系统｜全年级完整词库+句子</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== 基础重置 & 默认渲染 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #e8edf5;
            min-height: 100vh;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, -apple-system, sans-serif;
            padding: 16px 20px;
            color: #1e293b;
            transition: background 0.6s ease, color 0.4s ease;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* ===== 高级渲染：灰色护眼背景 + 淡蓝/淡绿光晕 (iOS 26 风格) ===== */
        body.advanced {
            background: #d5dbe3;
            color: #0f172a;
        }
        body.advanced::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle at 20% 30%, rgba(180, 210, 240, 0.3), rgba(200, 230, 220, 0.15) 40%, #d5dbe3 85%);
            animation: breatheGlow 12s ease-in-out infinite alternate;
        }
        body.advanced::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle at 80% 70%, rgba(160, 200, 180, 0.2), transparent 60%);
            animation: breatheGlow2 15s ease-in-out infinite alternate;
        }
        @keyframes breatheGlow {
            0% { transform: scale(1) rotate(0deg); opacity: 0.6; }
            100% { transform: scale(1.15) rotate(2deg); opacity: 1; }
        }
        @keyframes breatheGlow2 {
            0% { transform: scale(0.92) rotate(-2deg); opacity: 0.4; }
            100% { transform: scale(1.08) rotate(2deg); opacity: 0.8; }
        }
        body.advanced .container { position: relative; z-index: 1; }

        /* ===== 夜间模式（独立或叠加） ===== */
        body.night {
            background: #0a0e1a;
            color: #e0e8f0;
        }
        body.night.advanced {
            background: #0a0e1a;
        }
        body.night.advanced::before {
            background: radial-gradient(circle at 20% 30%, rgba(80, 120, 220, 0.25), rgba(40, 60, 140, 0.15) 40%, #0a0e1a 85%);
        }
        body.night.advanced::after {
            background: radial-gradient(circle at 80% 70%, rgba(120, 80, 200, 0.15), transparent 60%);
        }
        body.night:not(.advanced) {
            background: #0d1117;
        }

        /* ===== 容器 ===== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ===== 卡片基础样式 ===== */
        .glass-card,
        .letter-card,
        .controls-card,
        .stats-card,
        .history-section {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(200, 210, 220, 0.3);
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            z-index: 1;
        }

        /* ===== iOS 26 液态玻璃渲染（高级模式） ===== */
        body.advanced .glass-card,
        body.advanced .letter-card,
        body.advanced .controls-card,
        body.advanced .stats-card,
        body.advanced .history-section {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(40px) saturate(1.8);
            -webkit-backdrop-filter: blur(40px) saturate(1.8);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            border-radius: 32px;
        }
        body.advanced .glass-card:hover,
        body.advanced .letter-card:hover,
        body.advanced .controls-card:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }
        body.advanced .glass-card::before,
        body.advanced .letter-card::before,
        body.advanced .controls-card::before,
        body.advanced .stats-card::before,
        body.advanced .history-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            opacity: 0.6;
            pointer-events: none;
        }
        body.advanced .letter-card::after {
            content: '';
            position: absolute;
            top: -30%;
            left: -30%;
            width: 160%;
            height: 160%;
            background: radial-gradient(circle at 40% 30%, rgba(200, 230, 240, 0.06), transparent 60%);
            pointer-events: none;
            animation: cardGlow 8s ease-in-out infinite alternate;
            z-index: 0;
        }
        body.advanced .letter-card>* { position: relative; z-index: 1; }
        @keyframes cardGlow {
            0% { transform: translate(-5%, -5%) scale(1); opacity: 0.3; }
            100% { transform: translate(5%, 5%) scale(1.12); opacity: 0.6; }
        }

        /* ===== 夜间模式卡片 ===== */
        body.night .glass-card,
        body.night .letter-card,
        body.night .controls-card,
        body.night .stats-card,
        body.night .history-section {
            background: rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            color: #e0e8f0;
        }
        body.night .glass-card:hover,
        body.night .letter-card:hover,
        body.night .controls-card:hover {
            background: rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.12);
        }
        body.night.advanced .glass-card,
        body.night.advanced .letter-card,
        body.night.advanced .controls-card,
        body.night.advanced .stats-card,
        body.night.advanced .history-section {
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(40px) saturate(1.8);
            -webkit-backdrop-filter: blur(40px) saturate(1.8);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        body.night.advanced .glass-card:hover,
        body.night.advanced .letter-card:hover,
        body.night.advanced .controls-card:hover {
            background: rgba(0, 0, 0, 0.25);
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        body.night.advanced .letter-card::after {
            background: radial-gradient(circle at 40% 30%, rgba(80, 120, 240, 0.05), transparent 60%);
        }

        /* ===== 顶部导航/操作栏 ===== */
        header {
            text-align: center;
            padding: 16px 24px 14px;
            position: relative;
            overflow: visible;
            flex-shrink: 0;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 6px;
        }
        .header-title-group {
            text-align: left;
            flex: 1;
        }
        .header-title-group h1 {
            font-weight: 800;
            font-size: 1.8rem;
            letter-spacing: -0.5px;
            color: #1e293b;
            transition: color 0.4s;
            line-height: 1.2;
        }
        body.advanced .header-title-group h1 {
            background: linear-gradient(135deg, #1e293b, #4a6a8b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }
        body.night .header-title-group h1 { color: #e0e8f0; }
        body.night.advanced .header-title-group h1 {
            background: linear-gradient(135deg, #c0d0ff, #a0b8ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .header-title-group .subtitle {
            color: #475569;
            font-weight: 500;
            opacity: 0.8;
            font-size: 0.85rem;
            transition: color 0.4s;
            margin-top: 0px;
        }
        body.advanced .header-title-group .subtitle { color: #334155; }
        body.night .header-title-group .subtitle { color: #8899b0; }
        body.night.advanced .header-title-group .subtitle { color: #a0b0c8; }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .glass-toggle {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 40px;
            padding: 6px 14px;
            color: #1e293b;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .glass-toggle:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.5);
        }
        .glass-toggle:active { transform: scale(0.94); }
        body.night .glass-toggle {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
            color: #b0c0d0;
        }
        body.night .glass-toggle:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.2);
            color: #e0e8f0;
        }
        body.night.advanced .glass-toggle {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.06);
            color: #b0c0d0;
        }
        body.night.advanced .glass-toggle:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.12);
            color: #e0e8f0;
        }
        .glass-toggle.icon-only {
            padding: 6px 10px;
            font-size: 1.1rem;
        }
        #cycleTypeBtn {
            min-width: 90px;
            justify-content: center;
        }

        /* ===== 主内容（核心拉伸布局） ===== */
        .main-content {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            align-items: stretch;
            min-height: 60vh;
        }
        .letter-display-section {
            flex: 2.5;
            min-width: 320px;
            display: flex;
            flex-direction: column;
        }
        .controls-section {
            flex: 1.2;
            min-width: 280px;
            display: flex;
            flex-direction: column;
        }

        /* ===== 字母卡片（展示区） ===== */
        .letter-card {
            padding: 24px 20px;
            text-align: center;
            cursor: pointer;
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.15s, box-shadow 0.4s, background 0.4s;
            overflow: hidden;
            min-height: 40vh;
        }
        .letter-card:active { transform: scale(0.98); }
        body.advanced .letter-card:active { transform: scale(0.96); }

        .letter-display {
            font-weight: 800;
            line-height: 1.1;
            margin: 4px 0;
            overflow: hidden;
            max-width: 100%;
            word-break: break-word;
            color: #1e293b;
            transition: color 0.4s;
        }
        body.advanced .letter-display { color: #0f172a; text-shadow: 0 2px 8px rgba(255, 255, 255, 0.3); }
        body.night .letter-display { color: #e0e8f0; }
        body.night.advanced .letter-display { color: #f0f4ff; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3); }

        .letter-display.letter {
            font-size: clamp(8rem, 18vw, 24rem);
            white-space: nowrap;
        }
        .letter-display.word {
            font-size: clamp(5rem, 10vw, 16rem);
            white-space: normal;
            word-break: break-word;
            line-height: 1.2;
            padding: 8px 4px;
        }
        .letter-display.sentence {
            font-size: clamp(2.2rem, 4.5vw, 6.5rem);
            white-space: normal;
            line-height: 1.4;
            padding: 8px 4px;
        }

        body.advanced .letter-display { animation: slideUpFade 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes slideUpFade { 0% { opacity: 0; transform: translateY(28px) scale(0.94); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        .letter-display { animation: simpleFade 0.25s ease; }
        @keyframes simpleFade { 0% { opacity: 0; transform: scale(0.97); } 100% { opacity: 1; transform: scale(1); } }

        .letter-info {
            font-size: 0.9rem;
            background: rgba(240, 245, 250, 0.6);
            display: inline-block;
            padding: 4px 18px;
            border-radius: 40px;
            margin: 6px auto;
            border: 1px solid rgba(200, 210, 220, 0.2);
            color: #334155;
            transition: background 0.4s, border 0.4s, color 0.4s;
        }
        body.advanced .letter-info {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #1e293b;
            backdrop-filter: blur(4px);
        }
        body.night .letter-info {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.08);
            color: #b0c0d0;
        }
        body.night.advanced .letter-info {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.06);
            color: #c0d0e0;
        }

        .word-meaning, .sentence-translation {
            font-size: 1rem;
            background: rgba(248, 245, 235, 0.5);
            padding: 4px 16px;
            border-radius: 28px;
            display: inline-block;
            margin-top: 6px;
            border: 1px solid rgba(220, 210, 190, 0.2);
            transition: background 0.4s, border 0.4s, color 0.4s;
        }
        body.advanced .word-meaning, body.advanced .sentence-translation {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #1e293b;
            backdrop-filter: blur(4px);
        }
        body.night .word-meaning, body.night .sentence-translation {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.06);
            color: #b0c0d0;
        }
        body.night.advanced .word-meaning, body.night.advanced .sentence-translation {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.06);
            color: #c0d0e0;
        }

        /* ===== 发音按钮 ===== */
        .voice-btn {
            background: rgba(26, 188, 156, 0.1);
            border: 1px solid rgba(26, 188, 156, 0.2);
            color: #1abc9c;
            padding: 6px 22px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
        }
        .voice-btn:hover {
            background: rgba(26, 188, 156, 0.2);
            border-color: rgba(26, 188, 156, 0.3);
            transform: translateY(-2px);
        }
        .voice-btn:active { transform: scale(0.94); }
        body.advanced .voice-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #1e293b;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
        }
        body.advanced .voice-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.4);
            color: #0f172a;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.04);
        }
        body.night .voice-btn {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.06);
            color: #b0c0d0;
        }
        body.night .voice-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.1);
            color: #e0e8f0;
        }
        body.night.advanced .voice-btn {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.06);
            color: #b0c0d0;
        }
        body.night.advanced .voice-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.1);
            color: #e0e8f0;
        }

        /* ===== 控件区（右侧） ===== */
        .controls-card {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .grade-book-selector {
            background: rgba(240, 245, 250, 0.4);
            border-radius: 20px;
            padding: 14px 16px;
            border: 1px solid rgba(200, 210, 220, 0.2);
            transition: background 0.4s, border 0.4s;
            flex-shrink: 0;
        }
        body.advanced .grade-book-selector {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
        }
        body.night .grade-book-selector {
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(255, 255, 255, 0.04);
        }
        body.night.advanced .grade-book-selector {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.06);
        }

        .selector-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
        .selector-row label { min-width: 32px; font-weight: 600; color: #475569; font-size: 0.85rem; transition: color 0.4s; }
        body.advanced .selector-row label { color: #1e293b; }
        body.night .selector-row label { color: #8899b0; }
        body.night.advanced .selector-row label { color: #a0b0c8; }

        .selector-row select {
            flex: 1;
            padding: 6px 12px;
            border-radius: 40px;
            border: 1px solid rgba(200, 210, 220, 0.4);
            background: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.25s;
            min-width: 60px;
        }
        .selector-row select:hover { background: rgba(255, 255, 255, 0.9); border-color: #4f83f5; }
        .selector-row select:focus { outline: none; border-color: #4f83f5; box-shadow: 0 0 0 2px rgba(79, 131, 245, 0.1); }
        body.advanced .selector-row select {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #0f172a;
        }
        body.advanced .selector-row select:hover { background: rgba(255, 255, 255, 0.4); border-color: rgba(255, 255, 255, 0.3); }
        body.night .selector-row select {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.06);
            color: #c0d0e0;
        }
        body.night .selector-row select:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.1); }
        body.night.advanced .selector-row select {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.06);
            color: #c0d0e0;
        }
        body.night.advanced .selector-row select:hover { background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.08); }

        /* ===== Toggle开关 ===== */
        .mode-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(240, 245, 250, 0.3);
            border-radius: 60px;
            padding: 6px 14px;
            border: 1px solid rgba(200, 210, 220, 0.15);
            transition: background 0.4s, border 0.4s, color 0.4s;
            color: #1e293b;
            flex-shrink: 0;
        }
        body.advanced .mode-toggle {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #1e293b;
            backdrop-filter: blur(4px);
        }
        body.night .mode-toggle {
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(255, 255, 255, 0.04);
            color: #b0c0d0;
        }
        body.night.advanced .mode-toggle {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.06);
            color: #b0c0d0;
            backdrop-filter: blur(4px);
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 18px;
            flex-shrink: 0;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(180, 190, 200, 0.5);
            border-radius: 24px;
            transition: 0.25s;
            border: 1px solid rgba(200, 210, 220, 0.15);
        }
        .toggle-slider:before {
            content: "";
            position: absolute;
            height: 12px;
            width: 12px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            border-radius: 50%;
            transition: 0.25s;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }
        input:checked + .toggle-slider { background-color: #4f83f5; border-color: #4f83f5; }
        input:checked + .toggle-slider:before { transform: translateX(18px); }

        body.advanced .toggle-slider { background-color: rgba(180, 190, 200, 0.3); border-color: rgba(255, 255, 255, 0.15); }
        body.advanced input:checked + .toggle-slider { background-color: #4f83f5; border-color: #4f83f5; }
        body.night .toggle-slider { background-color: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.04); }
        body.night input:checked + .toggle-slider { background-color: #4f83f5; border-color: #4f83f5; }

        // ======================================================================
        // 核心逻辑

        // ===== 音效 =====
        let audioCtx = null;
        function playClickSound() {
            try {
                if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 800;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.06);
            } catch (_) {}
        }
        document.querySelectorAll('button, .history-item, .toggle-switch input, #backgroundDrawCard')
            .forEach(el => el.addEventListener('click', playClickSound));

        // ===== 高级渲染 + 夜间模式切换 =====
        function updateModes() {
            const isAdvanced = advancedToggleHeader.classList.contains('active');
            const isNight = nightToggleHeader.classList.contains('active');
            document.body.classList.toggle('advanced', isAdvanced);
            document.body.classList.toggle('night', isNight);
        }

        advancedToggleHeader.addEventListener('click', function() {
            this.classList.toggle('active');
            this.style.color = this.classList.contains('active') ? '#4f83f5' : '';
            updateModes();
        });
        nightToggleHeader.addEventListener('click', function() {
            this.classList.toggle('active');
            this.style.color = this.classList.contains('active') ? '#a0b8ff' : '';
            updateModes();
        });

        function showFeedback(msg) {
            if (feedbackTimer) clearTimeout(feedbackTimer);

            quickFeedback.style.animation = 'none';
            void quickFeedback.offsetWidth;
            quickFeedback.style.animation = 'slideDownFade 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
            feedbackTimer = setTimeout(() => { quickFeedback.style.display = 'none'; }, 2000);
        }

        // ===== 统计 =====
        function updateStats() {
            totalDrawsSpan.textContent = stats.totalDraws;
            correctSpan.textContent = stats.correctPronunciations;
            let acc = stats.totalDraws ? Math.round((stats.correctPronunciations / stats.totalDraws) * 100) : 0;
            accuracySpan.textContent = acc + '%';
            if (currentContentType === 'word' && currentWordBank.length) {
                currentIndexSpan.textContent = (currentWordIndex + 1) + '/' + currentWordBank.length;
            } else if (currentContentType === 'sentence' && currentSentenceBank.length) {
                currentIndexSpan.textContent = (currentSentenceIndex + 1) + '/' + currentSentenceBank.length;
            } else {
                currentIndexSpan.textContent = '0/0';
            }
        }

        function updateHistory() {
            historyListDiv.innerHTML = '';
            history.slice(0, 12).forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `${item.content} ${item.isBold ? '<span class="bold-mark">⭐</span>' : ''}`;
                div.onclick = () => {
                    if (item.type === 'word') {
                        currentContentData = { content: item.content, chinese: item.chinese, type: 'word',
                            isBold: item.isBold };
                        updateDisplay();
                    } else if (item.type === 'sentence') {
                        currentContentData = { content: item.content, chinese: item.chinese, type: 'sentence' };
                        updateDisplay();
                    } else {
                        currentContentData = { content: item.content, type: 'letter', isUppercase: true };
                        updateDisplay();
                    }
                    showFeedback(`重新练习: ${item.content}`);
                    playClickSound();
                };
                historyListDiv.appendChild(div);
            });
        }

        // ===== 显示更新 =====
        function updateDisplay() {
            const { content, type, chinese, isBold } = currentContentData;
            currentContentEl.style.animation = 'none';
            void currentContentEl.offsetWidth;
            currentContentEl.style.animation = 'slideUpFade 0.35s cubic-bezier(0.34, 1.56, 0.64, 1)';

            currentContentEl.textContent = content || '';
            currentContentEl.className = 'letter-display';
            if (type === 'word') {
                currentContentEl.classList.add('word');
                contentInfoEl.innerHTML = `英文单词 ${isBold ? '<span class="bold-badge">核心词汇</span>' : ''}`;
                wordMeaningDiv.style.display = 'block';
                wordChineseSpan.textContent = chinese || '';
                sentenceTranslationDiv.style.display = 'none';
                let len = (content || '').length;
                let size = len <= 5 ? 'clamp(4rem, 8vw, 12rem)' : len <= 8 ? 'clamp(3.5rem, 7vw, 10rem)' :
                    'clamp(3rem, 6vw, 8rem)';
                currentContentEl.style.fontSize = size;
                currentContentEl.style.padding = '8px 4px';
            } else if (type === 'sentence') {
                currentContentEl.classList.add('sentence');
                contentInfoEl.textContent = `英文句子`;
                wordMeaningDiv.style.display = 'none';
                sentenceTranslationDiv.style.display = 'block';
                sentenceChineseSpan.textContent = chinese || '';
                let len = (content || '').length;
                let size = len <= 20 ? 'clamp(2.2rem, 4vw, 6rem)' : len <= 40 ? 'clamp(1.8rem, 3.5vw, 5rem)' :
                    'clamp(1.5rem, 3vw, 4rem)';
                currentContentEl.style.fontSize = size;
                currentContentEl.style.padding = '8px 4px';
            } else {
                currentContentEl.classList.add('letter');
                contentInfoEl.textContent = type === 'letter' ? (currentContentData.isUppercase ? `大写字母 ${content}` :
                    `小写字母 ${content}`) : '';
                wordMeaningDiv.style.display = 'none';
                sentenceTranslationDiv.style.display = 'none';
                currentContentEl.style.fontSize = '';
                currentContentEl.style.padding = '10px';
            }
            recognitionResult.textContent = '';
            recognitionResult.className = 'recognition-result';
            updateStats();
        }

        // ===== 数据加载 =====
        function loadCurrentContent() {
            const grade = gradeSelect.value;
            const book = bookSelect.value;
            const unit = unitSelect.value;
            if (!grade || !book || !unit) return;

            if (currentContentType === 'word') {
                const words = wordBank[grade]?.[book]?.[unit] || [];
                currentWordBank = words;
                currentWordIndex = 0;
                if (currentWordBank.length === 0) {
                    showFeedback('当前单元无单词，请切换单元');
                    currentContentData = { content: '无单词', type: 'word', chinese: '' };
                    updateDisplay();
                } else {
                    drawContent();
                }
            } else if (currentContentType === 'sentence') {
                const sentences = sentenceBank[grade]?.[book]?.[unit] || [];
                currentSentenceBank = sentences;
                currentSentenceIndex = 0;
                if (currentSentenceBank.length === 0) {
                    showFeedback('当前单元无句子，请切换单元');
                    currentContentData = { content: '无句子', type: 'sentence', chinese: '' };
                    updateDisplay();
                } else {
                    drawContent();
                }
            }
            updateStats();
        }

        // ===== 抽取内容 =====
        function drawContent() {
            if (currentContentType !== 'word' && currentContentType !== 'sentence') {
                const isUp = Math.random() > 0.5;
                const letters = isUp ? 'ABCDEFGHIJKLMNOPQRSTUVWXYZ' : 'abcdefghijklmnopqrstuvwxyz';
                const letter = letters[Math.floor(Math.random() * 26)];
                currentContentData = { content: letter, type: 'letter', isUppercase: isUp };
                updateDisplay();
                stats.totalDraws++;
                history.unshift({ content: letter, type: 'letter' });
                updateStats();
                updateHistory();
                return;
            }

            if (currentContentType === 'word') {
                if (currentWordBank.length === 0) { showFeedback('当前无单词，请选择其他单元'); return; }
                let idx;
                if (isStudyMode) {
                    idx = currentWordIndex % currentWordBank.length;
                    currentWordIndex = (idx + 1) % currentWordBank.length;
                } else {
                    idx = Math.floor(Math.random() * currentWordBank.length);
                    currentWordIndex = idx;
                }
                const word = currentWordBank[idx];
                currentContentData = { content: word.word, chinese: word.chinese, type: 'word', isBold: word.isBold };
                updateDisplay();
                stats.totalDraws++;
                history.unshift({ content: word.word, chinese: word.chinese, type: 'word', isBold: word.isBold });
                updateStats();
                updateHistory();
                if (isReadMode) startRecognition();
            } else if (currentContentType === 'sentence') {
                if (currentSentenceBank.length === 0) { showFeedback('当前无句子，请选择其他单元'); return; }
                let idx;
                if (isStudyMode) {
                    idx = currentSentenceIndex % currentSentenceBank.length;
                    currentSentenceIndex = (idx + 1) % currentSentenceBank.length;
                } else {
                    idx = Math.floor(Math.random() * currentSentenceBank.length);
                    currentSentenceIndex = idx;
                }
                const sentence = currentSentenceBank[idx];
                currentContentData = { content: sentence.sentence, chinese: sentence.chinese, type: 'sentence' };
                updateDisplay();
                stats.totalDraws++;
                history.unshift({ content: sentence.sentence, chinese: sentence.chinese, type: 'sentence' });
                updateStats();
                updateHistory();
                if (isReadMode) startRecognition();
            }
        }

        function nextContent() {
            drawContent();
        }

        // ===== 语音合成 =====
        function speakContent() {
            const text = currentContentData.content;
            if (!text) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }

        // ===== 语音识别 =====
        function initRecognition() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                showFeedback('⚠️ 您的浏览器不支持语音识别，请使用 Chrome 或 Edge');
                return null;
            }
            const rec = new SR();
            rec.lang = 'en-US';
            rec.continuous = false;
            rec.interimResults = false;
            rec.maxAlternatives = 1;

            rec.onstart = function() {
                isRecognizing = true;
                listeningIndicator.classList.add('active');
                recognitionResult.textContent = '👂 聆听中...';
                recognitionResult.className = 'recognition-result';
            };

            rec.onerror = function(event) {
                isRecognizing = false;
                listeningIndicator.classList.remove('active');
                if (event.error === 'not-allowed') {
                    recognitionResult.textContent = '❌ 麦克风权限被拒绝';
                    recognitionResult.className = 'recognition-result wrong';
                    showFeedback('请允许使用麦克风');
                } else if (event.error === 'no-speech') {
                    recognitionResult.textContent = '🔇 未检测到语音，请重试';
                    recognitionResult.className = 'recognition-result wrong';
                } else {
                    recognitionResult.textContent = '⚠️ 识别错误: ' + event.error;
                    recognitionResult.className = 'recognition-result wrong';
                }
                if (recognitionTimeout) { clearTimeout(recognitionTimeout);
                    recognitionTimeout = null; }
            };

            rec.onend = function() {
                isRecognizing = false;
                listeningIndicator.classList.remove('active');
                if (recognitionTimeout) { clearTimeout(recognitionTimeout);
                    recognitionTimeout = null; }
                if (!recognitionResult.textContent || recognitionResult.textContent === '👂 聆听中...') {
                    recognitionResult.textContent = '⏱️ 未识别到内容，请点击卡片重试';
                    recognitionResult.className = 'recognition-result wrong';
                }
            };

            rec.onresult = function(event) {
                const result = event.results[0];
                if (!result) return;
                const transcript = result[0].transcript.trim();
                isRecognizing = false;
                listeningIndicator.classList.remove('active');
                if (recognitionTimeout) { clearTimeout(recognitionTimeout);
                    recognitionTimeout = null; }

                const target = currentContentData.content || '';
                const normalizedTarget = target.toLowerCase().replace(/[^a-z0-9\s']/g, '').trim();
                const normalizedTranscript = transcript.toLowerCase().replace(/[^a-z0-9\s']/g, '').trim();

                let isMatch = false;
                if (normalizedTarget === normalizedTranscript) isMatch = true;
                else if (normalizedTarget.length > 3 && normalizedTranscript.includes(normalizedTarget)) isMatch = true;
                else if (normalizedTranscript.length > 3 && normalizedTarget.includes(normalizedTranscript)) isMatch = true;
                else {
                    const targetNoSpace = normalizedTarget.replace(/\s/g, '');
                    const transNoSpace = normalizedTranscript.replace(/\s/g, '');
                    if (targetNoSpace === transNoSpace) isMatch = true;
                    else if (targetNoSpace.length > 2 && transNoSpace.includes(targetNoSpace)) isMatch = true;
                }

                if (isMatch) {
                    recognitionResult.textContent = '✅ 正确！ 👏 你说: "' + transcript + '"';
                    recognitionResult.className = 'recognition-result correct';
                    stats.correctPronunciations = Math.min(stats.correctPronunciations + 1, stats.totalDraws);
                    updateStats();
                    showFeedback('🎉 发音正确！');
                } else {
                    recognitionResult.textContent = '❌ 再试一次  你说: "' + transcript + '"  目标: "' + target + '"';
                    recognitionResult.className = 'recognition-result wrong';
                    showFeedback('💪 再练练吧，目标是: ' + target);
                }
            };
            return rec;
        }

        function startRecognition() {
            if (!isReadMode || currentContentType === 'letter') return;
            if (recognition) { try { recognition.abort(); } catch (_) {} }
            if (!recognition) { recognition = initRecognition(); if (!recognition) return; }
            if (recognitionTimeout) { clearTimeout(recognitionTimeout);
                recognitionTimeout = null; }
            try {
                recognition.start();
                recognitionTimeout = setTimeout(() => {
                    if (isRecognizing) {
                        try { recognition.abort(); } catch (_) {}
                        isRecognizing = false;
                        listeningIndicator.classList.remove('active');
                        recognitionResult.textContent = '⏱️ 识别超时，请点击卡片重试';
                        recognitionResult.className = 'recognition-result wrong';
                    }
                    recognitionTimeout = null;
                }, 6000);
            } catch (_) {}
        }

        backgroundCard.addEventListener('click', function(e) {
            if (e.target.closest('button') || e.target.closest('.toggle-switch')) return;
            if (isReadMode && currentContentType !== 'letter') {
                startRecognition();
            } else {
                nextContent();
            }
        });

        // ===== 认读模式切换 =====
        readModeToggle.addEventListener('change', function(e) {
            isReadMode = this.checked;
            if (isReadMode) {
                if (!recognition) recognition = initRecognition();
                showFeedback('🎤 认读模式已开启，点击卡片开始语音练习');
                if (currentContentType !== 'letter' && currentContentData.content) {
                    setTimeout(() => startRecognition(), 300);
                }
            } else {
                if (recognition) { try { recognition.abort(); } catch (_) {} }
                isRecognizing = false;
                listeningIndicator.classList.remove('active');
                if (recognitionTimeout) { clearTimeout(recognitionTimeout);
                    recognitionTimeout = null; }
                recognitionResult.textContent = '';
                recognitionResult.className = 'recognition-result';
                showFeedback('🔇 认读模式已关闭');
            }
        });

        // ===== 内容类型循环切换 =====
        const typeLabels = ['🔤 字母', '📖 单词', '💬 句子'];
        const typeMap = ['letter', 'word', 'sentence'];
        let typeIndex = 1;

        function cycleContentType() {
            typeIndex = (typeIndex + 1) % 3;
            const newType = typeMap[typeIndex];
            switchContentType(newType);
            cycleTypeBtn.innerHTML = typeLabels[typeIndex];
            showFeedback(`切换到 ${typeLabels[typeIndex]}`);
        }

        cycleTypeBtn.addEventListener('click', cycleContentType);

        function switchContentType(type) {
            currentContentType = type;
            if (type === 'letter') {
                contentSelector.style.display = 'none';
                currentContentData = { content: 'A', type: 'letter', isUppercase: true };
                updateDisplay();
                if (isReadMode && recognition) { try { recognition.abort(); } catch (_) {} }
            } else if (type === 'word') {
                contentSelector.style.display = 'block';
                updateUnitOptions();
            } else {
                contentSelector.style.display = 'block';
                updateUnitOptions();
            }
            stats.totalDraws = 0;
            stats.correctPronunciations = 0;
            updateStats();
            recognitionResult.textContent = '';
            recognitionResult.className = 'recognition-result';
        }

        // ===== 控件 =====
        function updateUnitOptions() {
            const grade = gradeSelect.value;
            const book = bookSelect.value;
            if (!grade || !book) {
                unitSelect.innerHTML = '<option disabled selected>请先选择年级和册别</option>';
                unitSelect.disabled = true;
                return;
            }
            let units = [];
            if (currentContentType === 'word') {
                units = wordBank[grade]?.[book] ? Object.keys(wordBank[grade][book]) : [];
            } else if (currentContentType === 'sentence') {
                units = sentenceBank[grade]?.[book] ? Object.keys(sentenceBank[grade][book]) : [];
            }
            if (units.length === 0) {
                unitSelect.innerHTML = '<option disabled>无单元数据</option>';
                unitSelect.disabled = true;
            } else {
                unitSelect.innerHTML = units.map(u => `<option value="${u}">${u}</option>`).join('');
                unitSelect.disabled = false;
                loadCurrentContent();
            }
        }

        gradeSelect.addEventListener('change', updateUnitOptions);
        bookSelect.addEventListener('change', updateUnitOptions);
        unitSelect.addEventListener('change', loadCurrentContent);

        // ===== 顺序/抽读模式 =====
        studyModeBtn.addEventListener('click', function() {
            isStudyMode = !isStudyMode;
            currentStudyModeSpan.textContent = isStudyMode ? '顺序模式' : '抽读模式';
            this.innerHTML = isStudyMode ? '<i class="fas fa-random"></i> 切换抽读模式' :
                '<i class="fas fa-exchange-alt"></i> 切换顺序模式';
            if (currentContentType === 'word') { currentWordIndex = 0;
                loadCurrentContent(); } else if (currentContentType === 'sentence') { currentSentenceIndex = 0;
                loadCurrentContent(); }
            showFeedback(isStudyMode ? '已切换为顺序模式' : '已切换为抽读模式');
        });

        speakBtn.addEventListener('click', speakContent);

        // ===== 键盘快捷键 =====
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') { e.preventDefault();
                nextContent(); } else if (e.code === 'KeyS') { e.preventDefault();
                speakContent(); } else if (e.code === 'KeyR') { e.preventDefault();
                readModeToggle.checked = !readModeToggle.checked;
                readModeToggle.dispatchEvent(new Event('change')); } else if (e.code === 'KeyM') { e.preventDefault();
                studyModeBtn.click(); } else if (e.code === 'Digit1') { e.preventDefault();
                cycleContentType(); }
        });

        // ===== 初始化 =====
        switchContentType('word');
        updateUnitOptions();
        advancedToggleHeader.classList.remove('active');
        nightToggleHeader.classList.remove('active');
        updateModes();

        console.log('✅ 英语认读系统已启动 | 优化PC全屏布局');
        console.log('🎯 快捷键: 空格抽取 | S发音 | R认读 | M顺序/随机 | 1 切换板块');
    </script>
</body>
</html>
