<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>英语认读系统｜全年级词库（含句子） + 只看粗体单词</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 32px 20px;
            color: #1e293b;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }
        .glass-card, .letter-card, .controls-card, .stats-card, .history-section {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        header {
            text-align: center;
            padding: 28px 24px;
        }
        h1 {
            background: linear-gradient(135deg, #2c3e50, #1f2b38);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            font-weight: 800;
            font-size: 2rem;
        }
        .subtitle {
            color: #475569;
            margin-top: 8px;
        }
        .content-type-selector {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .content-type-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            background: rgba(236, 240, 241, 0.8);
            color: #2c3e50;
            transition: 0.2s;
        }
        .content-type-btn.active {
            background: linear-gradient(to right, #3498db, #2980b9);
            color: white;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }
        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 32px;
        }
        .letter-display-section {
            flex: 2.5;
            min-width: 320px;
        }
        .controls-section {
            flex: 1;
            min-width: 280px;
        }
        .letter-card {
            padding: 40px 24px;
            text-align: center;
            cursor: pointer;
            position: relative;
            min-height: 520px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .letter-display {
            font-weight: 800;
            font-size: 16rem;
            line-height: 1.2;
            margin: 20px 0;
            overflow-x: auto;
            white-space: nowrap;
            word-break: break-word;
        }
        .letter-display.word {
            font-size: 6rem;
            white-space: normal;
            word-break: break-word;
            line-height: 1.3;
            padding: 20px 10px;
        }
        .letter-display.sentence {
            font-size: 2rem;
            white-space: normal;
            line-height: 1.4;
            padding: 20px 10px;
        }
        .letter-info {
            font-size: 1.2rem;
            background: rgba(0, 0, 0, 0.05);
            display: inline-block;
            padding: 6px 20px;
            border-radius: 40px;
            margin: 12px auto;
        }
        .word-meaning, .sentence-translation {
            font-size: 1.1rem;
            background: rgba(255, 255, 200, 0.6);
            padding: 8px 16px;
            border-radius: 28px;
            display: inline-block;
            margin-top: 12px;
        }
        .voice-btn {
            background: linear-gradient(120deg, #1abc9c, #16a085);
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
        }
        .grade-book-selector {
            background: rgba(248, 250, 252, 0.7);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .selector-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            align-items: center;
            flex-wrap: wrap;
        }
        .selector-row select {
            flex: 1;
            padding: 10px 16px;
            border-radius: 40px;
            border: 1px solid #ccc;
            background: white;
            font-size: 0.9rem;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 14px 0;
            border: none;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }
        .btn-primary {
            background: linear-gradient(120deg, #3498db, #2980b9);
            color: white;
        }
        .mode-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(248, 249, 250, 0.7);
            border-radius: 60px;
            padding: 12px 20px;
            margin: 14px 0;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 52px;
            height: 26px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            border-radius: 26px;
            transition: 0.3s;
        }
        .toggle-slider:before {
            content: "";
            position: absolute;
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: 0.3s;
        }
        input:checked+.toggle-slider {
            background-color: #f1c40f;
        }
        input:checked+.toggle-slider:before {
            transform: translateX(24px);
        }
        .stats-card {
            padding: 24px;
            margin-top: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 12px;
        }
        .stat-item {
            background: rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            padding: 14px;
            text-align: center;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 800;
        }
        .history-section {
            padding: 24px;
        }

            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            max-height: 160px;
            overflow-y: auto;
            padding: 8px;
        }

            background: rgba(255, 255, 245, 0.95);
            border-radius: 20px;
            padding: 8px 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            transition: 0.1s;
        }
        .history-item .bold-mark {
            color: #f1c40f;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .quick-feedback {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            z-index: 2000;
            display: none;
            font-size: 0.9rem;
            white-space: nowrap;

            font-size: 0.7rem;
            color: #64748b;
            margin-top: 16px;
        }

            font-size: 0.8rem;

            color: #333;

            margin-left: 8px;
            display: inline-block;

</head>

<div class="container">
    <header class="glass-card">
        <h1><i class="fas fa-microphone-alt"></i> 英语语音认读系统</h1>
        <p class="subtitle">人教版PEP三年级起点 · 全年级词库（含句子） | ⭐ 开启「只看粗体」筛选核心单词</p>
        <p class="subtitle">⌨️ 快捷键：空格抽取 | S发音 | R认读模式 | M顺序/随机 | 1/2/3切换类型</p>
        <div class="content-type-selector">
            <button class="content-type-btn active" id="letterBtn">🔤 字母认读</button>
            <button class="content-type-btn" id="wordBtn">📖 单词认读</button>
            <button class="content-type-btn" id="sentenceBtn">💬 句子认读</button>
        </div>
    </header>

    <div class="main-content">
        <section class="letter-display-section">
            <div class="letter-card" id="backgroundDrawCard">
                <div class="letter-display" id="currentContent">A</div>
                <div class="letter-info" id="contentInfo">大写字母 A</div>
                <div class="word-meaning" id="wordMeaning" style="display: none;">中文：<span id="wordChinese"></span></div>
                <div class="sentence-translation" id="sentenceTranslation" style="display: none;">中文：<span id="sentenceChinese"></span></div>
                <div>
                    <button class="voice-btn" id="speakContentBtn"><i class="fas fa-volume-up"></i> 播放发音</button>
                </div>
                <div class="click-hint"><i class="fas fa-hand-pointer"></i> 点击卡片空白处抽取新内容</div>
            </div>
        </section>

        <section class="controls-section">
            <div class="controls-card">
                <div class="grade-book-selector" id="contentSelector" style="display: none;">
                    <div class="selector-row"><label>📘 年级：</label><select id="gradeSelect"><option value="3">三年级</option><option value="4">四年级</option><option value="5">五年级</option><option value="6">六年级</option></select></div>
                    <div class="selector-row"><label>📖 册别：</label><select id="bookSelect"><option value="upper">上册</option><option value="lower">下册</option></select></div>
                    <div class="selector-row"><label>📌 单元：</label><select id="unitSelect" disabled></select></div>
                </div>
                <div class="mode-toggle">
                    <div><i class="fas fa-microphone"></i> 认读模式</div>
                    <label class="toggle-switch"><input type="checkbox" id="readModeToggle"><span class="toggle-slider"></span></label>
                </div>
                <div class="mode-toggle">
                    <div><i class="fas fa-bold"></i> 只看粗体单词（核心词汇）</div>
                    <label class="toggle-switch"><input type="checkbox" id="boldOnlyToggle"><span class="toggle-slider"></span></label>
                </div>
                <button class="btn btn-primary" id="drawButton"><i class="fas fa-dice-d6"></i> 抽取内容</button>
                <button class="btn" id="studyModeBtn" style="background:#9b59b6; color:white;"><i class="fas fa-exchange-alt"></i> 切换顺序模式</button>
                <div style="text-align:center; margin-top:6px;"><span id="currentStudyMode">抽读模式</span> | 顺序模式按序练习</div>
            </div>
            <div class="stats-card">
                <h3>📊 学习统计</h3>
                <div class="stats-grid">
                    <div class="stat-item"><div class="stat-value" id="totalDraws">0</div><div>练习次数</div></div>
                    <div class="stat-item"><div class="stat-value" id="correctPronunciations">0</div><div>正确次数</div></div>
                    <div class="stat-item"><div class="stat-value" id="currentIndex">0</div><div>当前进度</div></div>
                    <div class="stat-item"><div class="stat-value" id="accuracyRate">0%</div><div>准确率</div></div>
                </div>
            </div>
        </section>
    </div>

    <div class="history-section">
        <h3>📝 最近练习 <span style="font-size:0.8rem;">(点击可重练)</span></h3>
        <div class="history-list" id="historyList"></div>
    </div>
</div>
<div class="quick-feedback" id="quickFeedback"></div>

        let acc = stats.totalDraws ? Math.round((stats.correctPronunciations / stats.totalDraws) * 100) : 0;
        accuracySpan.textContent = acc + '%';
        if (currentContentType === 'word' && currentWordBank.length) {
            currentIndexSpan.textContent = (currentWordIndex + 1) + ' / ' + currentWordBank.length;
        } else if (currentContentType === 'sentence' && currentSentenceBank.length) {
            currentIndexSpan.textContent = (currentSentenceIndex + 1) + ' / ' + currentSentenceBank.length;
        } else {
            currentIndexSpan.textContent = '0 / 0';
        }
    }
    
    function updateHistory() {
        historyListDiv.innerHTML = '';
        history.slice(0, 12).forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `${item.content} ${item.isBold ? '<span class="bold-mark">⭐</span>' : ''}`;
            div.onclick = () => {
                if (item.type === 'word') {
                    currentContentData = { content: item.content, chinese: item.chinese, type: 'word', isBold: item.isBold };
                    updateDisplay();
                } else if (item.type === 'sentence') {
                    currentContentData = { content: item.content, chinese: item.chinese, type: 'sentence' };
                    updateDisplay();
                }
                showFeedback(`重新练习: ${item.content}`);
            };
            historyListDiv.appendChild(div);
        });
    }
    
    function updateDisplay() {
        const { content, type, chinese, isBold } = currentContentData;
        currentContentEl.textContent = content;
        currentContentEl.className = 'letter-display';
        if (type === 'word') {
            currentContentEl.classList.add('word');
            contentInfoEl.innerHTML = `英文单词 ${isBold ? '<span class="bold-badge">核心词汇</span>' : ''}`;
            wordMeaningDiv.style.display = 'block';
            wordChineseSpan.textContent = chinese || '';
            sentenceTranslationDiv.style.display = 'none';
        } else if (type === 'sentence') {
            currentContentEl.classList.add('sentence');
            contentInfoEl.textContent = `英文句子`;
            wordMeaningDiv.style.display = 'none';
            sentenceTranslationDiv.style.display = 'block';
            sentenceChineseSpan.textContent = chinese || '';
        } else {
            currentContentEl.classList.remove('word', 'sentence');
            contentInfoEl.textContent = type === 'letter' ? (currentContentData.isUppercase ? `大写字母 ${content}` : `小写字母 ${content}`) : '';
            wordMeaningDiv.style.display = 'none';
            sentenceTranslationDiv.style.display = 'none';
        }
        // 字体适配
        if (type === 'word') {
            let len = content.length;
            let size = len <= 5 ? 6 : len <= 8 ? 4.5 : len <= 12 ? 3.2 : 2.4;
            currentContentEl.style.fontSize = size + 'rem';
            currentContentEl.style.padding = '20px 10px';
        } else if (type === 'sentence') {
            let len = content.length;
            let size = len <= 20 ? 2.2 : len <= 40 ? 1.8 : 1.5;
            currentContentEl.style.fontSize = size + 'rem';
            currentContentEl.style.padding = '20px 10px';
        } else {
            currentContentEl.style.fontSize = '16rem';
            currentContentEl.style.padding = '10px';
        }
    }
    
    function getFilteredWordList(fullList) {
        if (!isBoldOnly) return [...fullList];
        return fullList.filter(w => w.isBold === true);
    }
    
    function loadCurrentContent() {
        const grade = gradeSelect.value;
        const book = bookSelect.value;
        const unit = unitSelect.value;
        if (!grade || !book || !unit) return;
        
        if (currentContentType === 'word') {
            const words = wordBank[grade]?.[book]?.[unit] || [];
            fullWordBank = words;
            currentWordBank = getFilteredWordList(fullWordBank);
            currentWordIndex = 0;
            if (currentWordBank.length === 0) {
                showFeedback('当前单元无单词，请切换单元');
                currentContentData = { content: '无单词', type: 'word', chinese: '' };
                updateDisplay();
            } else {
                drawContent();
            }
        } else if (currentContentType === 'sentence') {
            const sentences = sentenceBank[grade]?.[book]?.[unit] || [];
            currentSentenceBank = sentences;
            currentSentenceIndex = 0;
            if (currentSentenceBank.length === 0) {
                showFeedback('当前单元无句子，请切换单元');
                currentContentData = { content: '无句子', type: 'sentence', chinese: '' };
                updateDisplay();
            } else {
                drawContent();
            }
        }
        updateStats();
    }
    
    function drawContent() {
        if (currentContentType !== 'word' && currentContentType !== 'sentence') {
            // 字母模式
            const isUp = Math.random() > 0.5;
            const letter = isUp ? 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[Math.floor(Math.random()*26)] : 'abcdefghijklmnopqrstuvwxyz'[Math.floor(Math.random()*26)];
            currentContentData = { content: letter, type: 'letter', isUppercase: isUp };
            updateDisplay();
            stats.totalDraws++;
            history.unshift({ content: letter, type: 'letter' });
            updateStats();
            updateHistory();
            return;
        }
        
        if (currentContentType === 'word') {
            if (currentWordBank.length === 0) {
                showFeedback('当前无单词，请选择其他单元');
                return;
            }
            let idx;
            if (isStudyMode) {
                idx = currentWordIndex % currentWordBank.length;
                currentWordIndex = (idx + 1) % currentWordBank.length;
            } else {
                idx = Math.floor(Math.random() * currentWordBank.length);
                currentWordIndex = idx;
            }
            const word = currentWordBank[idx];
            currentContentData = { content: word.word, chinese: word.chinese, type: 'word', isBold: word.isBold };
            updateDisplay();
            stats.totalDraws++;
            history.unshift({ content: word.word, chinese: word.chinese, type: 'word', isBold: word.isBold });
            updateStats();
            updateHistory();
        } else if (currentContentType === 'sentence') {
            if (currentSentenceBank.length === 0) {
                showFeedback('当前无句子，请选择其他单元');
                return;
            }
            let idx;
            if (isStudyMode) {
                idx = currentSentenceIndex % currentSentenceBank.length;
                currentSentenceIndex = (idx + 1) % currentSentenceBank.length;
            } else {
                idx = Math.floor(Math.random() * currentSentenceBank.length);
                currentSentenceIndex = idx;
            }
            const sentence = currentSentenceBank[idx];
            currentContentData = { content: sentence.sentence, chinese: sentence.chinese, type: 'sentence' };
            updateDisplay();
            stats.totalDraws++;
            history.unshift({ content: sentence.sentence, chinese: sentence.chinese, type: 'sentence' });
            updateStats();
            updateHistory();
        }
    }
    
    function nextContent() {
        if (currentContentType === 'letter') {
            drawContent();
        } else if (currentContentType === 'word') {
            if (currentWordBank.length === 0) return;
            if (isStudyMode) {
                currentWordIndex = (currentWordIndex + 1) % currentWordBank.length;
                const word = currentWordBank[currentWordIndex];
                currentContentData = { content: word.word, chinese: word.chinese, type: 'word', isBold: word.isBold };
                updateDisplay();
                stats.totalDraws++;
                history.unshift({ content: word.word, chinese: word.chinese, type: 'word', isBold: word.isBold });
                updateStats();
                updateHistory();
            } else {
                drawContent();
            }
        } else if (currentContentType === 'sentence') {
            if (currentSentenceBank.length === 0) return;
            if (isStudyMode) {
                currentSentenceIndex = (currentSentenceIndex + 1) % currentSentenceBank.length;
                const sentence = currentSentenceBank[currentSentenceIndex];
                currentContentData = { content: sentence.sentence, chinese: sentence.chinese, type: 'sentence' };
                updateDisplay();
                stats.totalDraws++;
                history.unshift({ content: sentence.sentence, chinese: sentence.chinese, type: 'sentence' });
                updateStats();
                updateHistory();
            } else {
                drawContent();
            }
        }
    }
    
    function speakContent() {
        const text = currentContentData.content;
        if (!text) return;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.8;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
    }
    
    function updateUnitOptions() {
        const grade = gradeSelect.value;
        const book = bookSelect.value;
        if (!grade || !book) {
            unitSelect.innerHTML = '<option disabled selected>请先选择年级和册别</option>';
            unitSelect.disabled = true;
            return;
        }
        let units = [];
        if (currentContentType === 'word') {
            units = wordBank[grade]?.[book] ? Object.keys(wordBank[grade][book]) : [];
        } else if (currentContentType === 'sentence') {
            units = sentenceBank[grade]?.[book] ? Object.keys(sentenceBank[grade][book]) : [];
        }
        if (units.length === 0) {
            unitSelect.innerHTML = '<option disabled>无单元数据</option>';
            unitSelect.disabled = true;
        } else {
            unitSelect.innerHTML = units.map(u => `<option value="${u}">${u}</option>`).join('');
            unitSelect.disabled = false;
            loadCurrentContent();
        }
    }
    
    function switchContentType(type) {
        currentContentType = type;
        letterBtn.classList.remove('active');
        wordBtn.classList.remove('active');
        sentenceBtn.classList.remove('active');
        if (type === 'letter') {
            letterBtn.classList.add('active');
            contentSelector.style.display = 'none';
            boldOnlyToggle.disabled = true;
            currentContentData = { content: 'A', type: 'letter', isUppercase: true };
            updateDisplay();
        } else if (type === 'word') {
            wordBtn.classList.add('active');
            contentSelector.style.display = 'block';
            boldOnlyToggle.disabled = false;
            updateUnitOptions();
        } else {
            sentenceBtn.classList.add('active');
            contentSelector.style.display = 'block';
            boldOnlyToggle.disabled = true;
            boldOnlyToggle.checked = false;
            isBoldOnly = false;
            updateUnitOptions();
        }
        stats.totalDraws = 0;
        stats.correctPronunciations = 0;
        updateStats();
    }
    
    // 事件绑定
    gradeSelect.addEventListener('change', updateUnitOptions);
    bookSelect.addEventListener('change', updateUnitOptions);
    unitSelect.addEventListener('change', loadCurrentContent);
    drawBtn.addEventListener('click', nextContent);
    speakBtn.addEventListener('click', speakContent);
    backgroundCard.addEventListener('click', (e) => {
        if (e.target === speakBtn || speakBtn.contains(e.target)) return;
        nextContent();
    });
    studyModeBtn.addEventListener('click', () => {
        isStudyMode = !isStudyMode;
        currentStudyModeSpan.textContent = isStudyMode ? '顺序模式' : '抽读模式';
        studyModeBtn.textContent = isStudyMode ? '切换为抽读模式' : '切换为顺序模式';
        if (currentContentType === 'word') {
            currentWordIndex = 0;
            loadCurrentContent();
        } else if (currentContentType === 'sentence') {
            currentSentenceIndex = 0;
            loadCurrentContent();
        }
        showFeedback(isStudyMode ? '已切换为顺序模式' : '已切换为抽读模式');
    });
    readModeToggle.addEventListener('change', (e) => {
        isReadMode = e.target.checked;
        showFeedback(isReadMode ? '认读模式开启（语音识别演示）' : '认读模式关闭');
    });
    boldOnlyToggle.addEventListener('change', (e) => {
        isBoldOnly = e.target.checked;
        if (currentContentType === 'word') {
            loadCurrentContent();
        }
        showFeedback(isBoldOnly ? '只看核心单词（粗体）' : '显示所有单词');
    });
    letterBtn.addEventListener('click', () => switchContentType('letter'));
    wordBtn.addEventListener('click', () => switchContentType('word'));
    sentenceBtn.addEventListener('click', () => switchContentType('sentence'));
    
    // 键盘快捷键
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            nextContent();
        } else if (e.code === 'KeyS') {
            e.preventDefault();
            speakContent();
        } else if (e.code === 'KeyR') {
            e.preventDefault();
            readModeToggle.checked = !readModeToggle.checked;
            readModeToggle.dispatchEvent(new Event('change'));
        } else if (e.code === 'KeyM') {
            e.preventDefault();
            studyModeBtn.click();
        } else if (e.code === 'Digit1') {
            e.preventDefault();
            switchContentType('letter');
        } else if (e.code === 'Digit2') {
            e.preventDefault();
            switchContentType('word');
        } else if (e.code === 'Digit3') {
            e.preventDefault();
            switchContentType('sentence');
        }
    });
    
    // 初始化
    switchContentType('word');
    updateUnitOptions();
</script>
</body>
